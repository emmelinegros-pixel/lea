<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEA English Lab</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2a4a">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: calm, encouraging, precise
   IDEA a lagoon-side workbook: one exercise card at a time, the teacher's colour code on every answer
   PICTURE the live exercise card itself, large, with tiles to drag and blanks to fill
   COLOUR lagoon teal ground band, white page; teacher code: navy exercise, red WRONG, green MODEL, blue remember, grey note, amber trap
   TYPE Lexend 700 + Lexend 400
   LAYOUT laptop: card left, weak-spot meters right; phone: title, card, meters */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1a1c);--ink:light-dark(#14222a,#e8f1f2);--soft:light-dark(#5b6b72,#9fb2b7);--line:light-dark(#d9e3e6,#2a3a3e);--panel:light-dark(#f4f8f9,#16252a);--lagoon:light-dark(#0a7c86,#0d5d65);--lagoonhi:light-dark(#d8f1f3,#103a3f);--navy:light-dark(#16295a,#22397a);--red:light-dark(#c93a3a,#ff7b7b);--redbg:light-dark(#fdeeee,#3a1c1f);--green:light-dark(#21804a,#5fd38f);--greenbg:light-dark(#e8f6ee,#163126);--blue:light-dark(#1f63c6,#7fb0ff);--bluebg:light-dark(#eaf1fc,#17253f);--grey:light-dark(#5b6b72,#a6b6bb);--greybg:light-dark(#f1f3f4,#1d2a2e);--amber:light-dark(#a86a00,#ffc457);--amberbg:light-dark(#fff5e0,#3a2d12)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Lexend,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,44px) max(5vw,16px)}
.top{background:var(--lagoon);color:#fff}
.top h1{font-size:clamp(32px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.top p{margin:0;max-width:60ch;opacity:.92}
.wrap{max-width:1240px;margin:0 auto}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(18px,3vw,36px);align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.cardhead{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.cardhead b{font-weight:500}
.cardbody{padding:clamp(16px,2.6vw,28px)}
.q{font-size:clamp(19px,2.4vw,23px);line-height:1.45;margin:4px 0 18px;font-weight:500}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--navy);text-align:center;padding:0 6px;margin:0 2px;color:var(--navy);cursor:pointer;min-height:1.3em;vertical-align:baseline}
:root[data-theme=dark] .gap,.gap{border-color:light-dark(#16295a,#8fa8ff);color:light-dark(#16295a,#c5d3ff)}
.gap.sel{background:var(--lagoonhi)}
.gap.over{background:var(--lagoonhi);outline:2px dashed var(--lagoon)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
button{font:inherit;color:inherit;cursor:pointer}
.opt{min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);text-align:left;font-size:17px}
.opt:hover{border-color:var(--lagoon)}
.opt.on{border-color:var(--navy);background:var(--lagoonhi)}
.opt.good{border-color:var(--green);background:var(--greenbg)}
.opt.bad{border-color:var(--red);background:var(--redbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;min-height:48px}
.tile{min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--navy);background:var(--bg);font-size:17px;touch-action:none;user-select:none}
.tile.used{opacity:.25;pointer-events:none}
.line{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed var(--line);border-radius:12px;margin-bottom:10px}
.line .tile{background:var(--lagoonhi)}
input[type=text]{font:inherit;font-size:18px;width:100%;max-width:420px;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
input[type=text]:focus,button:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
.hint{color:var(--soft);font-size:14px;margin:6px 0 0}
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{min-height:48px;padding:10px 22px;border-radius:10px;border:0;background:var(--lagoon);color:#fff;font-weight:500}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:18px;display:grid;gap:8px}
.pill{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:10px;padding:10px 14px;border-radius:10px;align-items:baseline}
.pill b{font-size:13px;font-weight:700;white-space:nowrap}
.wrong{background:var(--redbg)}.wrong b{color:var(--red)}
.model{background:var(--greenbg)}.model b{color:var(--green)}
.note{background:var(--greybg)}.note b{color:var(--grey)}
.remember{background:var(--bluebg)}.remember b{color:var(--blue)}
.trap{background:var(--amberbg)}.trap b{color:var(--amber)}
.idiom{background:light-dark(#f1ebfb,#2c2340)}
.idiom b{color:light-dark(#5b3a9b,#cdb6ff)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--lagoon);transition:width .3s}
.side h2{font-size:20px;margin:0 0 4px}
.side p{margin:0 0 12px;color:var(--soft);font-size:14px}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 3.2em;gap:4px 10px;margin-bottom:10px;font-size:14px}
.meter .bar{grid-column:1/-1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.meter .bar i{display:block;height:100%}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--soft)}
.years{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.yr{min-height:44px;padding:8px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.yr.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.big{font-size:clamp(40px,7vw,64px);font-weight:700;line-height:1;margin:6px 0}
.small{font-size:13px;color:var(--soft)}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;background:var(--lagoonhi);color:var(--ink)}
textarea{font:inherit;font-size:17px;width:100%;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);resize:vertical}
textarea:focus{outline:3px solid var(--lagoon);outline-offset:2px}
.bonus{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.bonus .en{font-size:18px;font-weight:500;margin:4px 0 10px}
.qblock{margin:18px 0 6px}
.qblock .q{font-size:18px;margin:0 0 10px}
.player{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 6px}
.transcript{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;line-height:1.7}
.btn[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.topnav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 auto 18px;max-width:1240px}
.topnav form{display:flex;gap:8px;flex:1 1 300px}
.topnav input[type=search]{font:inherit;font-size:16px;flex:1;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.linkbtn{background:none;border:0;padding:10px 0;min-height:44px;color:var(--blue);text-decoration:underline;font-size:15px}
b.hl{font-weight:700;color:var(--navy);border-bottom:2px dotted var(--blue);cursor:pointer}
:root[data-theme=dark] b.hl{color:light-dark(#16295a,#c5d3ff)}
.gloss{color:var(--blue);font-size:15px;font-weight:400}
.sheet table{width:100%;border-collapse:collapse;font-size:16px}
.sheet td,.sheet th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.sheet th{font-size:13px;color:var(--soft);font-weight:500}
.sheet td:first-child{font-weight:500}
.hidefr .fr{filter:blur(6px);cursor:pointer}
.learn{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.learn li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.learn .en{font-size:18px;font-weight:500;margin:0}
.learn .fr{margin:0;color:var(--soft)}
.learn button{grid-row:1/span 2;grid-column:2}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:10px}
.cards button{text-align:left;min-height:84px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel)}
.cards button:hover{border-color:var(--lagoon)}
.res{display:grid;gap:8px}
.res button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:48px}
.res mark{background:var(--amberbg);color:inherit;padding:0 2px}
@media(max-width:600px){.sheet td,.sheet th{padding:8px 4px}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
.spotq{line-height:2.1}.spotq .sx{color:#b42318;font-weight:700}.wd{font:inherit;border:0;background:none;padding:1px 3px;margin:0 -1px;border-radius:5px;cursor:pointer;color:inherit}.wd:hover{background:#eef2f9}.wd.on{background:#fde7b0;box-shadow:inset 0 -2px 0 #b54708}.wd.good{background:#dcf5e3;box-shadow:inset 0 -2px 0 #067647}.wd.bad{background:#fde3e1;text-decoration:line-through}
.glo{padding:12px 14px;border:1px solid var(--line);border-left:5px solid #1d5fa8;border-radius:10px;background:var(--panel)}
</style>
</head>
<body>
<header class="band top"><div class="wrap">
<h1>LEA English Lab</h1>
</div></header>

<main class="band"><nav class="topnav" aria-label="Navigation"><button class="btn ghost" id="back" type="button">← Back</button><button class="btn ghost" id="homebtn" type="button">Home</button><form id="sform" role="search"><label for="sq" class="small" hidden>Search</label><input type="search" id="sq" placeholder="Search a word, in English or French" autocomplete="off"><button class="btn" type="submit">Search</button></form><button class="btn ghost" id="sheetsbtn" type="button">Revision sheets</button></nav><div class="wrap grid">
<section id="stage" aria-live="polite"></section>
<aside class="side">
<div class="panel">
<h2>My weak spots</h2>
<div id="meters"></div>
<button class="btn ghost" id="reset" type="button">Start again from zero</button>
</div>
</aside>
</div></main>

<script>
{
/* ---------- FAMILIES ---------- */
const FAM={
agr:{n:"Subject + verb agreement",tip:"Trouvez le vrai sujet. Un sujet singulier → verbe + s au présent (everyone calls, which drives). Sujet pluriel → pas de s (visitor numbers have)."},
tense:{n:"Tenses and time words",tip:"Fait daté (last night, in 2019) → prétérit (passé anglais d'un fait terminé). Lien avec le NOW (since, for, in the last ten years) → HAVE-EN (have + participe passé : have worked)."},
art:{n:"Articles: a, the or nothing",tip:"Générique, langues, domaines → Ø. Un exemple d'une catégorie → a / an. Quelque chose d'identifié → the."},
rel:{n:"Who, which, whose, where",tip:"who / whom pour les personnes, which pour les choses ou pour toute une idée, whose = dont + nom, where = un lieu."},
count:{n:"Countable or uncountable",tip:"information, advice, equipment : indénombrables (qu'on ne compte pas : ni s, ni a/an), sans s (much, a lot of, some). few = peu ; a few = quelques-uns."},
none:{n:"Some, any, no, none, no one",tip:"NONE reprend un nom cité. NO ONE = une personne, sans nom avant. ANY = n'importe lequel."},
verb:{n:"Verb patterns",tip:"to + base verbale (to leave). suggest, avoid, be used to + V-ing (verbe + -ing : working). discuss et lack sans préposition (petit mot devant un nom : à, de, pour)."},
conf:{n:"Words French speakers mix up",tip:"leave ≠ live, actually ≠ actuellement, raise qqch ≠ rise, lie ≠ lay, over 300 = plus de 300."},
link:{n:"Linking sentences",tip:"despite + nom, although + verbe conjugué. , which reprend toute une idée. Une phrase tronquée se rattache par une virgule."},
noun:{n:"Noun + noun and 's",tip:"N1-N2 = un type : le premier nom ne prend pas de s (visitor numbers, a shoe shop). Animé, moment, lieu, institution → 's."},
prep:{n:"Prepositions",tip:"at + heure, on + jour ou date, in + mois ou année ; by introduit, au passif (le sujet subit l'action : « est fabriqué »), celui qui fait l'action ; certains verbes ont leur préposition (account for, depend on)."},
order:{n:"Word order",tip:"Adverbe (mot qui précise le verbe : souvent, très) de fréquence devant le verbe. Jamais d'adverbe entre le verbe et son complément (ce qui complète le verbe ou le nom). Question : auxiliaire (verbe outil : « avoir » dans « j'ai mangé ») + sujet + verbe."}
,vague:{"n": "No vague words: use a precise word", "tip": "big, good, important, very, a lot, thing ne disent rien : prenez le mot précis (substantial, essential to, sound, severely, challenge)."},full:{"n": "No be, have, there is: use an action verb", "tip": "Ne pas utiliser BE, HAVE ou THERE IS. Prendre un vrai sujet et un vrai verbe d'action : un vrai sujet + un vrai verbe d'action."}};

/* ---------- ITEMS ----------
 t: mc (choose), type (write the word), drag (fill gaps from a word bank), order (build the sentence)
 y: lowest year the item suits (1 = L1, 2 = L2, 3 = L3)
 m: model sentence (English), w: explication (français), h2: rappel de cours (français, after the answer), hq: Hint (question, never the answer), nc: À ne pas confondre */
const I=[
{id:"a1",gs:"have",f:"agr",y:1,t:"mc",q:"Visitor numbers ___ tripled in ten years.",o:["have","has","is","are"],a:0,m:"Visitor numbers have tripled in ten years.",w:"have est ici HAVE au présent, avec le sujet numbers (un nom pluriel = they) : they have. has ne va qu'avec he, she, it ou un nom singulier.",h2:"Grammaire L1 S2 — visitor numbers = un type de chiffre. visitor dit de quel chiffre on parle et ne prend jamais de s ; le sujet, c'est numbers : il porte le pluriel et décide du verbe.",hq:"Grammaire L1 S2 — Dans visitor numbers, il y a deux noms : visitor et numbers. Lequel est le sujet ? Est-il au singulier ou au pluriel ? Le verbe du blanc s'accorde avec lui.",nc:"the number of visitors ___ (sujet : the number, singulier) ≠ visitor numbers ___ (sujet : numbers). Quelle forme pour chacun ?",fr:"Le nombre de visiteurs a triplé en dix ans."},
{id:"a2",f:"agr",y:2,t:"type",q:"In Hall's model, a low-context culture ___ things explicitly.",h:"say",a:["says"],m:"In Hall's model, a low-context culture says things explicitly.",w:"A culture = un seul sujet, au présent : le verbe prend un s → says.",h2:"Interculturalité L2 S4 — Hall : en culture low-context, l'information est portée par les mots, le message est direct et explicite ; en high-context, par le ton, les gestes, le non-dit.",hq:"Interculturalité L2 S4 — Le sujet du blanc est le nom culture (a low-context culture) : singulier ou pluriel ? Au présent, que prend le verbe à la 3e personne du singulier ?",nc:"low-context cultures ___ things explicitly (pluriel) ≠ a low-context culture ___ things explicitly (singulier).",fr:"Dans le modèle de Hall, une culture à contexte faible dit les choses explicitement.",gs:"agr"},
{id:"a3",f:"agr",y:1,t:"drag",q:"Everyone ___ her the village's memory, but nobody in Nouméa ___ her name.",b:["calls","call","knows","know"],a:["calls","knows"],m:"Everyone calls her the village's memory, but nobody in Nouméa knows her name.",w:"everyone et nobody désignent des personnes prises une à une : verbe au singulier → calls, knows.",h2:"Grammaire L1 S2 — no one, nobody, everyone, someone : des pronoms humains, toujours suivis d'un verbe au singulier.",hq:"Grammaire L1 S2 — everyone, nobody : une personne à la fois ou un groupe ? Le verbe se met donc au ___ ?",nc:"All the villagers ___ her… (pluriel) ≠ Everyone ___ her… (singulier).",fr:"Tout le monde l'appelle la mémoire du village, mais personne à Nouméa ne connaît son nom.",gs:"agr"},
{id:"a4",f:"agr",y:2,t:"mc",q:"Property prices are soaring in Nouméa, which ___ many young people to leave.",o:["drives","drive","driving","driven"],a:0,m:"Property prices are soaring in Nouméa, which drives many young people to leave.",w:"which reprend toute la phrase qui précède, une seule idée : le verbe prend un s → drives.",h2:"Traduction spécialisée L3 S6 — « Ce qui », impossible en tête de phrase en anglais soigné, est absorbé par une virgule : …, which…",hq:"Traduction spécialisée L3 S6 — Que reprend which ici : prices (pluriel) ou toute la phrase « les prix s'envolent » (une seule idée) ?",nc:"Prices, which ___ every year (which reprend prices) ≠ …, which ___ many young people to leave (which reprend toute la phrase).",fr:"Les prix de l'immobilier s'envolent à Nouméa, ce qui pousse beaucoup de jeunes à partir.",gs:"agr"},
{id:"a5",f:"agr",y:2,t:"type",q:"Our competitive advantage ___ on resources that are rare and hard to imitate.",h:"depend",a:["depends"],m:"Our competitive advantage depends on resources that are rare and hard to imitate.",w:"advantage est singulier → depends ; et dépendre de = depend on.",h2:"Business English L2 S4 — VRIO : la ressource a-t-elle de la valeur, est-elle rare, coûteuse à imiter, et l'entreprise est-elle organisée pour l'exploiter ?",hq:"Business English L2 S4 — Le sujet du blanc est le nom advantage (our competitive advantage) : singulier ou pluriel ? Et « dépendre de » = depend + quelle préposition (petit mot devant un nom : à, de, pour) ?",nc:"Our advantages ___ on… (pluriel) ≠ Our advantage ___ on… (singulier).",fr:"Notre avantage concurrentiel repose sur des ressources rares et difficiles à imiter.",gs:"agr"},
{id:"a6",f:"agr",y:1,t:"mc",q:"Her baskets ___ as far away as Europe.",o:["sell","sells","is sold","selling"],a:0,m:"Her baskets sell as far away as Europe.",w:"Le sujet est baskets, au pluriel : sell (ou are sold), jamais sells.",h2:"Traduction spécialisée L3 S6 — repérez le sujet que partagent les fragments : « Une artisane dont les paniers se vendent… » → whose baskets sell.",hq:"Traduction spécialisée L3 S6 — Qui se vend : la femme ou les paniers ? Le verbe s'accorde avec ___ ?",nc:"She ___ her baskets (elle vend ses paniers) ≠ Her baskets ___ (les paniers se vendent).",fr:"Ses paniers se vendent jusqu'en Europe.",gs:"agr"},
{id:"a7",f:"agr",y:2,t:"type",q:"Each of Hofstede's six dimensions ___ one problem every society must solve.",h:"describe",a:["describes"],m:"Each of Hofstede's six dimensions describes one problem every society must solve.",w:"Each of… = chacun pris un par un : verbe au singulier → describes.",h2:"Interculturalité L2 S4 — power distance, individualism, masculinity, uncertainty avoidance, long-term orientation, indulgence.",hq:"Interculturalité L2 S4 — Each of the six dimensions : les dimensions prises ensemble, ou une par une ? Singulier ou pluriel ?",nc:"The six dimensions ___ … (pluriel) ≠ Each of the six dimensions ___ … (singulier).",fr:"Chacune des six dimensions de Hofstede décrit un problème que toute société doit résoudre.",gs:"agr"},

{id:"t1",gs:"have",f:"tense",y:1,t:"mc",q:"Visitor numbers ___ in the last ten years.",o:["have tripled","tripled","has tripled","are tripling"],a:0,m:"Visitor numbers have tripled in the last ten years.",w:"in the last ten years : la période va jusqu'à maintenant → HAVE-EN (have + participe passé : have worked). HAVE au présent avec numbers (pluriel = they) : have, puis le participe passé (forme après « j'ai » : mangé, écrit) tripled.",h2:"Grammaire L1 S2 — « depuis dix ans » + présent est un calque (traduction mot à mot du français) : They are married since ten years ✗ → They have been married for ten years ✓.",hq:"Grammaire L1 S2 — in the last ten years : la période est-elle coupée du présent, ou va-t-elle jusqu'au NOW ? Quel aspect (action vue comme finie, en cours ou reliée au présent) pour un bilan (ce qui reste aujourd'hui d'une action passée) ?",nc:"In 2015, numbers ___ (fait daté, révolu) ≠ In the last ten years, numbers ___ (bilan [ce qui reste aujourd'hui d'une action passée], lien avec le NOW).",fr:"Le nombre de visiteurs a triplé au cours des dix dernières années."},
{id:"t2",f:"tense",y:1,t:"type",q:"She ___ the email last night.",h:"send",a:["sent"],m:"She sent the email last night.",w:"last night date l'événement : fait daté, coupé du présent → prétérit (passé anglais d'un fait terminé) : sent. HAVE-EN (have + participe passé : have worked) est impossible avec une date passée.",h2:"Grammaire L1 S2 — HAVE-EN (have + participe passé : have worked) = bilan (ce qui reste aujourd'hui d'une action passée), lien avec le NOW ; prétérit (passé anglais d'un fait terminé) + yesterday / last night / last month = événement situé dans un passé révolu.",hq:"Grammaire L1 S2 — last night date-t-il l'événement ? Avec une date passée, HAVE-EN (have + participe passé : have worked) est-il possible ?",nc:"She has already ___ the email (bilan [ce qui reste aujourd'hui d'une action passée], sans date) ≠ She ___ the email last night (fait daté).",fr:"Elle a envoyé le mail hier soir.",gs:"tense"},
{id:"t3",gs:"have",f:"tense",y:1,t:"drag",q:"She ___ at the UNC ___ two years, and she still loves it.",b:["has been","was","for","since","during"],a:["has been","for"],m:"She has been at the UNC for two years, and she still loves it.",w:"Elle y est toujours : lien avec le NOW → has been. Une durée → for ; un point de départ → since.",h2:"Grammaire L1 S2 — since donne le point de départ (since noon) ; for donne la durée (for six years). Since ne s'emploie jamais avec une durée.",hq:"Grammaire L1 S2 — Elle y est encore aujourd'hui : quel aspect (action vue comme finie, en cours ou reliée au présent) pour le lien avec le NOW ? two years : un point de départ ou une durée ?",nc:"___ 2024 (point de départ) ≠ ___ two years (durée) ≠ ___ the holidays (période nommée).",fr:"Elle est à l'UNC depuis deux ans, et elle s'y plaît toujours autant."},
{id:"t4",gs:"have",f:"tense",y:2,t:"mc",q:"The company ___ its prices three times since January.",o:["has raised","raised","has risen","have risen"],a:0,m:"The company has raised its prices three times since January.",w:"since January → HAVE-EN (have + participe passé : have worked). Et raise a un complément (ce qui complète le verbe ou le nom) d'objet (its prices) ; rise n'en a jamais.",h2:"Grammaire L1 S2 — raise = faire monter quelque chose (un mot après le verbe : raise prices) ; rise = monter tout seul (rien après le verbe). Question-test : qui fait l'action ?",hq:"Grammaire L1 S2 — since January : bilan (ce qui reste aujourd'hui d'une action passée) ou fait daté ? Qui fait monter les prix : quelqu'un (la société) ou les prix d'eux-mêmes ?",nc:"Prices have ___ (sans complément [ce qui complète le verbe ou le nom] : ils montent seuls) ≠ The company has ___ its prices (avec complément : quelqu'un fait monter les prix).",fr:"L'entreprise a augmenté ses prix trois fois depuis janvier."},
{id:"t5",f:"tense",y:1,t:"type",q:"Children listen to her ___ hours.",h:"one short word",a:["for"],m:"Children listen to her for hours.",w:"Une durée chiffrée → for. During se met devant une période nommée (during the holidays).",h2:"Grammaire L1 S2 — for + durée : for two years, for hours.",hq:"Grammaire L1 S2 — hours : est-ce une durée chiffrée ou une période nommée ?",nc:"___ hours, ___ two years (une durée) ≠ ___ the holidays, ___ the meeting (une période nommée).",fr:"Les enfants l'écoutent pendant des heures.",gs:"tense"},
{id:"t6",f:"tense",y:2,t:"mc",q:"When the divers ___ back from the pass, they reported three sharks.",o:["came","have come","come","had came"],a:0,m:"When the divers came back from the pass, they reported three sharks.",w:"Un récit terminé, au passé → prétérit (passé anglais d'un fait terminé) : came. « had came » n'existe pas (had come).",h2:"Traduction spécialisée L3 S6 — la tournure avec un participe (forme en -ed ou en -ing du verbe) : « De retour de la passe, les plongeurs… ».",hq:"Traduction spécialisée L3 S6 — Le récit est-il terminé, coupé du présent ? Quel est le prétérit (passé anglais d'un fait terminé) de come ?",nc:"le prétérit (come → ___) ≠ le participe passé (have / had + ___). Ici, faut-il un auxiliaire (verbe outil : « avoir » dans « j'ai mangé ») ?",fr:"Au retour de la passe, les plongeurs ont signalé trois requins.",gs:"tense"},

{id:"r1",f:"art",y:1,t:"mc",q:"___ property prices are soaring in Nouméa.",o:["Ø","The","A","Some"],a:0,m:"Property prices are soaring in Nouméa.",w:"Les prix en général : Ø + pluriel, énoncé générique. Le français dit « les », l'anglais rien.",h2:"Grammaire L1 S2 — énoncé générique ou de propriété (Dogs are faithful animals) : Ø + pluriel renvoie à la notion, sans extraction.",hq:"Grammaire L1 S2 — Parle-t-on de prix précis, déjà identifiés, ou des prix en général (énoncé générique) ?",nc:"___ prices in Nouméa are soaring (en général) ≠ ___ prices we saw yesterday were high (ceux-là, identifiés).",fr:"Les prix de l'immobilier s'envolent à Nouméa.",gs:"art"},
{id:"r2",f:"art",y:2,t:"drag",q:"___ French prefers nouns where ___ English uses a verb.",b:["Ø","Ø","The","the"],a:["Ø","Ø"],m:"French prefers nouns where English uses a verb.",w:"Les noms de langues ne prennent pas d'article (a, an ou the) : French, English.",h2:"Traduction spécialisée L3 S6 — la nominalisation : le français remplace volontiers le verbe par un nom, là où l'anglais garde le verbe.",hq:"Traduction spécialisée L3 S6 — French et English sont ici des noms de langue (le français, l'anglais). Un nom de langue prend-il un article (a, an ou the) en anglais ?",nc:"___ French (la langue) ≠ ___ French drink wine (les Français, le peuple).",fr:"Le français préfère les noms là où l'anglais emploie un verbe.",gs:"art"},
{id:"r3",f:"art",y:2,t:"mc",q:"The company has cancelled ___ Sunday crossing.",o:["the","Ø","a","some"],a:0,m:"The company has cancelled the Sunday crossing.",w:"Une traversée précise, identifiée par tous → the.",h2:"Grammaire L1 S2 — the Sunday crossing : N1 (Sunday) indique la période, comme dans a winter gale.",hq:"Grammaire L1 S2 — S'agit-il d'une traversée quelconque, ou de celle que tout le monde connaît, identifiée ?",nc:"They have cancelled ___ crossing (une parmi d'autres) ≠ They have cancelled ___ Sunday crossing (celle-là, connue de tous).",fr:"La compagnie a supprimé la traversée du dimanche.",gs:"art"},
{id:"r4",f:"art",y:2,t:"mc",q:"In Hall's model, Japan is ___ high-context culture.",o:["a","the","Ø","an"],a:0,m:"In Hall's model, Japan is a high-context culture.",w:"Un exemple pris dans une catégorie → a. An seulement devant un son voyelle.",h2:"Interculturalité L2 S4 — Hall : Japon, Chine, monde arabe, Amérique latine sont high-context ; USA, Allemagne, Suisse, Scandinavie, low-context.",hq:"Interculturalité L2 S4 — Le Japon est-il un exemple pris dans une catégorie, ou une culture déjà identifiée ? Le mot suivant commence-t-il par un son voyelle ?",nc:"Japan is ___ high-context culture (un exemple de la catégorie) ≠ ___ high-context culture we studied in class (celle-là).",fr:"Dans le modèle de Hall, le Japon est une culture à contexte fort.",gs:"art"},
{id:"r5",f:"art",y:3,t:"drag",q:"He is ___ self-taught chef and ___ pillar of neighbourhood life.",b:["a","a","an","the"],a:["a","a"],m:"He is a self-taught chef and a pillar of neighbourhood life.",w:"Après be, un métier ou un rôle prend a, là où le français n'en met pas (il est chef).",h2:"Traduction spécialisée L3 S6 — les constructions elliptiques : le français aligne des groupes nominaux qui font office de phrases ; l'anglais restitue le verbe une seule fois et reprend le sujet.",hq:"Traduction spécialisée L3 S6 — Après be, un métier ou un rôle (chef, pillar) : le français met-il un article (a, an ou the) ? Et l'anglais ?",nc:"« il est chef » (aucun article [a, an ou the] en français) ≠ he is ___ chef (anglais).",fr:"C'est un chef autodidacte et un pilier de la vie du quartier.",gs:"art"},
{id:"r6",f:"art",y:1,t:"mc",q:"___ English is an official language in Vanuatu, with French and Bislama.",o:["Ø","The","An","A"],a:0,m:"English is an official language in Vanuatu, with French and Bislama.",w:"Les noms de langues ne prennent pas d'article (a, an ou the) : l'anglais = English.",h2:"Grammaire L1 S2 — Ø devant une notion : English, tourism, wholemeal bread.",hq:"Grammaire L1 S2 — English est ici un nom de langue (l'anglais). Un nom de langue prend-il un article (a, an ou the) en anglais ?",nc:"« l'anglais » (article [a, an ou the] en français) ≠ ___ English (anglais).",fr:"L'anglais est une langue officielle au Vanuatu, avec le français et le bichelamar.",gs:"art"},

{id:"l1",f:"rel",y:2,t:"mc",q:"She is a craftswoman ___ baskets sell as far away as Europe.",o:["whose","where","which","who's"],a:0,m:"She is a craftswoman whose baskets sell as far away as Europe.",w:"« dont + nom » = whose + nom, sans article (a, an ou the). who's = who is.",h2:"Traduction spécialisée L3 S6 — repérez le sujet que partagent les fragments, puis reliez : une artisane dont les paniers…",hq:"Traduction spécialisée L3 S6 — « une artisane dont les paniers… » : quel relatif, suivi directement du nom baskets, dit que les paniers appartiennent à l'artisane ?",nc:"who's (= who is, contraction) ≠ le relatif de possession + nom : ___ baskets ?",fr:"C'est une artisane dont les paniers se vendent jusqu'en Europe.",gs:"rel"},
{id:"l2",f:"rel",y:2,t:"drag",q:"She is a storyteller ___ children listen to for hours.",b:["whom","whose","where","which"],a:["whom"],m:"She is a storyteller whom children listen to for hours.",w:"Une personne, complément (ce qui complète le verbe ou le nom) de listen to → whom (ou who, that).",h2:"Traduction spécialisée L3 S6 — Une conteuse que les enfants écoutent pendant des heures : le fragment devient une relative (partie de phrase qui décrit un nom : « que j'ai lu »).",hq:"Traduction spécialisée L3 S6 — Le relatif reprend le nom storyteller (le nom qu'il remplace) : une personne ou une chose ? Dans children listen to her, ce nom est-il sujet, ou complément (ce qui complète le verbe ou le nom) de listen to ?",nc:"a storyteller ___ tells stories (sujet) ≠ a storyteller ___ children listen to (complément [ce qui complète le verbe ou le nom]).",fr:"C'est une conteuse que les enfants écoutent pendant des heures.",gs:"rel"},
{id:"l3",f:"rel",y:2,t:"type",q:"A truncated sentence is a sentence ___ main verb is missing.",h:"one word",a:["whose"],m:"A truncated sentence is a sentence whose main verb is missing.",w:"« son verbe principal » = its main verb → whose main verb.",h2:"Traduction spécialisée L3 S6 — la phrase « tronquée » n'a pas de verbe conjugué : « Le chômage régresse. De plus en plus. »",hq:"Traduction spécialisée L3 S6 — « une phrase dont le verbe principal… » : quel relatif, suivi directement du nom main verb, dit que le verbe appartient à la phrase ?",nc:"a sentence ___ has no verb (sujet) ≠ a sentence ___ main verb is missing (possession).",fr:"Une phrase tronquée est une phrase dont le verbe principal manque.",gs:"rel"},
{id:"l4",f:"rel",y:2,t:"mc",q:"Lewis describes multi-active cultures, ___ people often do several things at once.",o:["where","which","whose","what"],a:0,m:"Lewis describes multi-active cultures, where people often do several things at once.",w:"« dans ces cultures » = un lieu, au sens large → where (ou in which).",h2:"Interculturalité L2 S4 — Lewis : linear-active (une chose à la fois, planning fixe), multi-active, reactive (écoute, réflexion, consensus).",hq:"Interculturalité L2 S4 — Le relatif reprend le nom cultures (le nom qu'il remplace), au sens de « dans ces cultures » : renvoie-t-il à un lieu, au sens large ?",nc:"cultures ___ value punctuality (sujet, une chose) ≠ cultures ___ people do several things at once (un lieu).",fr:"Lewis décrit les cultures multi-actives, où l'on fait souvent plusieurs choses à la fois.",gs:"rel"},
{id:"l5",f:"rel",y:1,t:"mc",q:"This is the president of the company ___ I told you about.",o:["which","whose","where","what"],a:0,m:"This is the president of the company which I told you about.",w:"La société est une chose → which (ou that). What ne suit jamais un nom.",h2:"Grammaire L1 S2 — quand le groupe est long ou suivi d'une relative (partie de phrase qui décrit un nom : « que j'ai lu »), of est obligatoire : the role of the universities that offer grants…",hq:"Grammaire L1 S2 — Le relatif reprend le nom company (le nom qu'il remplace) : une personne, une chose, un lieu ? what peut-il suivre un nom comme company ?",nc:"the company ___ I told you about (relatif après le nom company) ≠ ___ I told you is true (= ce que, sans nom avant).",fr:"Voici le président de l'entreprise dont je t'ai parlé.",gs:"rel"},
{id:"l6",f:"rel",y:2,t:"type",q:"Fuel prices have risen again, ___ is bad news for transport companies.",h:"one word",a:["which"],m:"Fuel prices have risen again, which is bad news for transport companies.",w:"« ce qui », après une virgule, reprend toute la phrase qui précède → which.",h2:"Traduction spécialisée L3 S6 — « Ce qui » → , which (rattaché par une virgule) ; ou, si l'on garde deux phrases, This.",hq:"Traduction spécialisée L3 S6 — « ce qui » reprend toute la phrase Fuel prices have risen again (pas un seul nom) : quel relatif, rattaché par une virgule ?",nc:"…, ___ is bad news (dans la même phrase) ≠ ___ is bad news. (si l'on garde deux phrases)",fr:"Le prix du carburant a encore augmenté, ce qui est une mauvaise nouvelle pour les transporteurs.",gs:"rel"},
{id:"l7",f:"rel",y:2,t:"drag",q:"Lifou, ___ the ferry no longer stops on Sundays, has lost visitors.",b:["where","which","whose","when"],a:["where"],m:"Lifou, where the ferry no longer stops on Sundays, has lost visitors.",w:"Un lieu → where.",h2:"Traduction L2 S4 — une information peut se loger dans une relative (partie de phrase qui décrit un nom : « que j'ai lu »), une apposition (l'incise entre virgules) ou une phrase autonome.",hq:"Traduction L2 S4 — Lifou est-il un lieu ? Quel relatif pour « où » ?",nc:"Lifou, ___ is a Loyalty island (sujet) ≠ Lifou, ___ the ferry stops (un lieu).",fr:"Lifou, où le bateau ne s'arrête plus le dimanche, a perdu des visiteurs.",gs:"rel"},

{id:"c1",f:"count",y:1,t:"mc",q:"He gave us a lot of ___ about the trip.",o:["information","informations","an information","the informations"],a:0,m:"He gave us a lot of information about the trip.",w:"information est indénombrable (qu'on ne compte pas : ni s, ni a/an) : jamais de s ni de a. Une information = a piece of information.",h2:"Grammaire L1 S2 — information, advice, furniture, luggage : fonctionnement continu (indénombrable [qu'on ne compte pas : ni s, ni a/an]), on les découpe par convention (a piece of…).",hq:"Grammaire L1 S2 — information est-il dénombrable (one, two…) ou indénombrable (continu) ?",nc:"« des informations » (pluriel possible en français) ≠ l'anglais, où le mot ne prend jamais de ___ ni de ___ ?",fr:"Il nous a donné beaucoup d'informations sur le voyage.",gs:"count"},
{id:"c2",f:"count",y:1,t:"type",q:"How ___ equipment do we need for the trip?",h:"one word",a:["much"],m:"How much equipment do we need for the trip?",w:"equipment est indénombrable (qu'on ne compte pas : ni s, ni a/an) → how much.",h2:"Grammaire L1 S2 — much avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an), many avec le dénombrable (qu'on peut compter : un, deux, trois) : I want much apples ✗ → many apples ✓.",hq:"Grammaire L1 S2 — equipment se compte-t-il (two equipments ?) ou est-il indénombrable (qu'on ne compte pas : ni s, ni a/an) ? Quel quantifieur (mot de quantité : beaucoup, quelques, aucun) va avec l'indénombrable ?",nc:"how ___ tools? (dénombrable [qu'on peut compter : un, deux, trois]) ≠ how ___ equipment? (indénombrable [qu'on ne compte pas : ni s, ni a/an]).",fr:"De combien de matériel avons-nous besoin pour le voyage ?",gs:"count"},
{id:"c3",f:"count",y:1,t:"mc",q:"She had ___ friends in Nouméa, so she felt lonely.",o:["few","a few","little","a little"],a:0,m:"She had few friends in Nouméa, so she felt lonely.",w:"few = peu, un manque (sens négatif). a few = quelques-uns (sens positif).",h2:"Grammaire L1 S2 — few, a few avec le dénombrable (qu'on peut compter : un, deux, trois) ; little, a little avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an) : There is little milk, but there are a few eggs.",hq:"Grammaire L1 S2 — Elle se sentait seule : le sens est-il positif (quelques amis) ou négatif (un manque) ? friends est-il dénombrable (qu'on peut compter : un, deux, trois) ?",nc:"___ friends = peu d'amis ≠ ___ friends = quelques amis ; little / a little vont avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an).",fr:"Elle avait peu d'amis à Nouméa, alors elle se sentait seule.",gs:"count"},
{id:"c4",f:"count",y:1,t:"mc",q:"We still have ___ time, so let's finish the exercise.",o:["some","little","few","a few"],a:0,m:"We still have some time, so let's finish the exercise.",w:"time est indénombrable (ni few ni a few) et le sens est positif → some, ou a little.",h2:"Grammaire L1 S2 — SOME quantitatif = une certaine quantité, dans une phrase affirmative.",hq:"Grammaire L1 S2 — time est-il dénombrable (qu'on peut compter : un, deux, trois) ici ? Le sens est-il positif (il en reste) ou négatif (il en manque) ?",nc:"few / a few (avec un dénombrable [qu'on peut compter : un, deux, trois]) ≠ little / a little (avec un indénombrable [qu'on ne compte pas : ni s, ni a/an]).",fr:"Il nous reste un peu de temps, alors finissons l'exercice.",gs:"count"},
{id:"c5",f:"count",y:2,t:"drag",q:"Ask for ___ before you invest: good ___ is rare.",b:["advice","advice","advices","an advice"],a:["advice","advice"],m:"Ask for advice before you invest: good advice is rare.",w:"advice est indénombrable (qu'on ne compte pas : ni s, ni a/an) : pas de s, pas de an. Un conseil = a piece of advice.",h2:"Business English L2 S4 — SWOT : strengths et weaknesses (internes), opportunities et threats (externes).",hq:"Business English L2 S4 — advice est-il dénombrable (qu'on peut compter : un, deux, trois) ou indénombrable (qu'on ne compte pas : ni s, ni a/an) ? Peut-il prendre un s, ou an ?",nc:"« des conseils » (pluriel en français) ≠ l'anglais, où le mot ne prend jamais de ___ ?",fr:"Demandez conseil avant d'investir : les bons conseils sont rares.",gs:"count"},
{id:"c6",f:"count",y:2,t:"mc",q:"The unemployment rate rose from 9% to 11%: it rose by two ___.",o:["points","percent","per cents","percents"],a:0,m:"The unemployment rate rose from 9% to 11%: it rose by two points.",w:"De 9 % à 11 % : deux points, pas deux pour cent.",h2:"Traduction L2 S4 — vérifiez l'unité avant de traduire : points ≠ pour cent. A two-point rise = une hausse de deux points.",hq:"Traduction L2 S4 — Vérifiez l'unité avant de traduire : de 9 % à 11 %, a-t-on ajouté 2 % de 9, ou deux unités sur l'échelle des pourcentages ?",nc:"passer de 9 % à 11 % (+2 ___) ≠ augmenter de 2 % (9 % × 1,02 = 9,18 %).",fr:"Le taux de chômage est passé de 9 % à 11 % : il a augmenté de deux points.",gs:"count"},

{id:"n1",f:"none",y:1,t:"mc",q:"How many of your friends came? ___.",o:["None","No one","Nobody","Any"],a:0,m:"How many of your friends came? None.",w:"NONE reprend un nom déjà cité (friends).",h2:"Grammaire L1 S2 — NONE est un pronom qui reprend obligatoirement un nom cité avant ; NO ONE s'emploie seul, pour des humains.",hq:"Grammaire L1 S2 — Le nom (friends) a-t-il été cité avant ? Quel pronom le reprend à la négative ?",nc:"___ (reprend un nom cité) ≠ ___ (une personne, sans nom avant : personne n'est venu).",fr:"Combien de tes amis sont venus ? Aucun.",gs:"none"},
{id:"n2",f:"none",y:1,t:"mc",q:"I called the office, but ___ answered.",o:["no one","none","anyone","anybody"],a:0,m:"I called the office, but no one answered.",w:"Pas de nom cité avant, une personne → no one.",h2:"Grammaire L1 S2 — NO ONE = négation de someone : No one knew the answer.",hq:"Grammaire L1 S2 — Le blanc reprend-il un nom déjà cité (comme friends dans « How many of your friends came? ») ? Ou veut-il dire « personne », sans nom avant ? the office n'est pas une personne.",nc:"How many came? — ___. (reprise d'un nom cité) ≠ I called, but ___ answered. (personne)",fr:"J'ai appelé le bureau, mais personne n'a répondu.",gs:"none"},
{id:"n3",f:"none",y:1,t:"type",q:"There is ___ paper left in the printer.",h:"one word",a:["no"],m:"There is no paper left in the printer.",w:"no + nom, avec un verbe affirmatif (is). NONE est impossible devant un nom.",h2:"Grammaire L1 S2 — There are not any buses after 10 p.m. = There are no buses after 10 p.m.",hq:"Grammaire L1 S2 — Le verbe (is) est affirmatif : quel quantifieur (mot de quantité : beaucoup, quelques, aucun) négatif se place devant le nom paper ?",nc:"There isn't ___ paper (verbe négatif) ≠ There is ___ paper (verbe affirmatif). NONE peut-il se placer devant un nom comme paper ?",fr:"Il n'y a plus de papier dans l'imprimante.",gs:"none"},
{id:"n4",f:"none",y:1,t:"mc",q:"You can take ___ seat you like.",o:["any","some","no","none"],a:0,m:"You can take any seat you like.",w:"Libre choix, n'importe lequel → any.",h2:"Grammaire L1 S2 — ANY = n'importe quel : Any taxi will take you to the airport.",hq:"Grammaire L1 S2 — Devant le nom seat : quel quantifieur (mot de quantité : beaucoup, quelques, aucun) veut dire « n'importe quel siège, celui que tu veux » ?",nc:"___ seats are free (certains, pas tous) ≠ take ___ seat you like (n'importe lequel).",fr:"Tu peux prendre la place que tu veux.",gs:"none"},
{id:"n5",f:"none",y:1,t:"drag",q:"Are there ___ messages for me? No, there are ___.",b:["any","none","some","no"],a:["any","none"],m:"Are there any messages for me? No, there are none.",w:"Question neutre → any. Réponse qui reprend le nom sans le répéter → none.",h2:"Grammaire L1 S2 — ANY dans les énoncés interrogatifs ; NONE pour reprendre un nom cité.",hq:"Grammaire L1 S2 — Premier blanc, devant le nom messages, dans une question neutre : quel quantifieur (mot de quantité : beaucoup, quelques, aucun) ? Second blanc, seul, sans répéter le nom messages : quel pronom ?",nc:"there are ___ messages (devant le nom messages) ≠ there are ___ (seul, sans répéter messages).",fr:"Y a-t-il des messages pour moi ? Non, il n'y en a aucun.",gs:"none"},
{id:"n6",f:"none",y:2,t:"mc",q:"___ of the twelve students had read the case study before class.",o:["None","No one","Nobody","No"],a:0,m:"None of the twelve students had read the case study before class.",w:"none of + groupe déterminé. No one ne se construit pas avec of.",h2:"Grammaire L1 S2 — none of them, reprise d'un nom cité ; no one, humain, autonome.",hq:"Grammaire L1 S2 — Suivi de of the twelve students : quel pronom reprend le nom students et veut dire « aucun d'entre eux » ?",nc:"___ of the students (se construit avec of) ≠ ___ came (une personne, jamais suivi de of).",fr:"Aucun des douze étudiants n'avait lu l'étude de cas avant le cours.",gs:"none"},

{id:"v1",f:"verb",y:2,t:"mc",q:"Soaring prices are driving many young people to ___ the capital.",o:["leave","left","leaving","leaves"],a:0,m:"Soaring prices are driving many young people to leave the capital.",w:"to + base verbale (le verbe tout nu, sans to ni s), toujours : to leave (jamais to left, to leaving).",h2:"Grammaire L1 S2 — leave, left, left = quitter, abandonner. Ne pas confondre avec live (vivre).",hq:"Grammaire L1 S2 — Après to (drive someone to…), quelle forme prend le verbe du blanc : base verbale (le verbe tout nu, sans to ni s), prétérit (passé anglais d'un fait terminé) ou -ing ?",nc:"to + base verbale (drive someone to ___) ≠ préposition (petit mot devant un nom : à, de, pour) + V-ing (succeed in ___).",fr:"La flambée des prix pousse beaucoup de jeunes à quitter la capitale.",gs:"verb"},
{id:"v2",f:"verb",y:1,t:"type",q:"The report suggests ___ prices.",h:"lower",a:["lowering"],m:"The report suggests lowering prices.",w:"suggest se construit avec V-ing (verbe + -ing : working).",h2:"Grammaire L1 S2 — + V-ing (verbe + -ing : working) : admit, advise, recommend, require, suggest, urge. I suggested to postpone ✗ → I suggested postponing ✓.",hq:"Grammaire L1 S2 — suggest se construit-il avec to + infinitif (le verbe précédé de to), ou avec V-ing (verbe + -ing : working) ?",nc:"want to ___ (to + infinitif [le verbe précédé de to]) ≠ suggest ___ (V-ing [verbe + -ing : working]).",fr:"Le rapport propose de baisser les prix.",gs:"verb"},
{id:"v3",f:"verb",y:1,t:"mc",q:"Let's discuss ___ the budget tomorrow.",o:["Ø","about","of","on"],a:0,m:"Let's discuss the budget tomorrow.",w:"discuss n'a jamais de préposition (petit mot devant un nom : à, de, pour).",h2:"Grammaire L1 S2 — discuter de = discuss Ø : discuss a problem, jamais discuss about.",hq:"Grammaire L1 S2 — « discuter de… » : discuss prend-il une préposition (petit mot devant un nom : à, de, pour) en anglais ?",nc:"talk ___ the budget (avec préposition [petit mot devant un nom : à, de, pour]) ≠ discuss ___ the budget.",fr:"Discutons du budget demain.",gs:"verb"},
{id:"v4",f:"verb",y:1,t:"mc",q:"Is she used to ___ on the left?",o:["driving","drive","drove","driven"],a:0,m:"Is she used to driving on the left?",w:"be used to + V-ing (verbe + -ing : working) : to est ici une préposition (petit mot devant un nom : à, de, pour), et après une préposition le verbe est toujours en -ING.",h2:"Grammaire L1 S2 — Question-test : « j'ai l'habitude de… » → be used to + V-ing (verbe + -ing : working) ; « autrefois je… » → used to + base verbale (le verbe tout nu, sans to ni s).",hq:"Grammaire L1 S2 — Pour dire « avoir l'habitude de… », quelle tournure ? be used to + ___ ?",nc:"« Avant (mais c'est fini), je… » : sujet + used to + ___ ?",fr:"A-t-elle l'habitude de conduire à gauche ?",gs:"verb"},
{id:"v5",f:"verb",y:1,t:"type",q:"We ___ to have evening classes, but they stopped.",h:"use",a:["used"],m:"We used to have evening classes, but they stopped.",w:"Une habitude passée et terminée → used to + base verbale (le verbe tout nu, sans to ni s).",h2:"Grammaire L1 S2 — used to n'existe qu'au passé ; à la forme négative et interrogative, used redevient use (didn't use to).",hq:"Grammaire L1 S2 — « Avant (mais c'est fini), nous avions des cours du soir » : sujet + ___ to + base verbale (le verbe tout nu, sans to ni s) ?",nc:"« J'ai l'habitude de… » : une autre tournure, avec be devant, et le verbe qui suit en ___ ?",fr:"Avant, nous avions des cours du soir, mais ils se sont arrêtés.",gs:"verb"},
{id:"v6",f:"verb",y:1,t:"drag",q:"The island lacks ___ fresh water and depends ___ tourism.",b:["Ø","of","on","from"],a:["Ø","on"],m:"The island lacks fresh water and depends on tourism.",w:"lack n'a pas de préposition (petit mot devant un nom : à, de, pour) ; depend en exige une : on.",h2:"Grammaire L1 S2 — manquer de = lack Ø ; dépendre de = depend on. Le français met « de » partout, l'anglais non.",hq:"Grammaire L1 S2 — « manquer de… » : lack prend-il une préposition (petit mot devant un nom : à, de, pour) ? « dépendre de… » : depend + ___ ?",nc:"Le français met « de » après les deux verbes ; l'anglais, après un seul. Lequel ?",fr:"L'île manque d'eau douce et dépend du tourisme.",gs:"verb"},
{id:"v7",f:"verb",y:2,t:"mc",q:"Many buyers avoid ___ flights with hidden fees.",o:["booking","to book","book","booked"],a:0,m:"Many buyers avoid booking flights with hidden fees.",w:"avoid se construit avec V-ing (verbe + -ing : working).",h2:"Business English L2 S4 — un frais caché trahit la promesse de l'annonce : le client l'évite.",hq:"Business English L2 S4 — avoid se construit-il avec to + infinitif (le verbe précédé de to), ou avec V-ing (verbe + -ing : working) ?",nc:"decide to ___ (to + infinitif [le verbe précédé de to]) ≠ avoid ___ (V-ing [verbe + -ing : working]).",fr:"Beaucoup d'acheteurs évitent de réserver des vols avec des frais cachés.",gs:"verb"},

{id:"f1",f:"conf",y:1,t:"mc",q:"Many young people ___ Nouméa to study in France.",o:["leave","live","life","lift"],a:0,m:"Many young people leave Nouméa to study in France.",w:"leave = partir, quitter ; live = vivre, habiter.",h2:"Grammaire L1 S2 — LEAVE traduit « laisser » au sens d'abandonner, quitter, déposer : leave the office.",hq:"Grammaire L1 S2 — Les jeunes partent-ils de Nouméa, ou y vivent-ils ? Quel verbe veut dire « quitter » ?",nc:"___ (voyelle longue /iː/ : quitter) ≠ ___ (voyelle courte /ɪ/ : vivre).",fr:"Beaucoup de jeunes quittent Nouméa pour aller étudier en France.",gs:"conf"},
{id:"f2",f:"conf",y:2,t:"mc",q:"Actually, most visitors come from Australia. Here actually means:",o:["in fact","at present","these days","recently"],a:0,m:"In fact, most visitors come from Australia.",w:"actually = en fait. Actuellement = currently, at present.",h2:"Traduction spécialisée L3 S6 — le faux-ami : Actually → « Actuellement » est un contresens ; eventually → « éventuellement », aussi.",hq:"Traduction spécialisée L3 S6 — actually ressemble à « actuellement » : est-ce un faux-ami ? Que veut-il dire ?",nc:"actually ≠ actuellement ; eventually ≠ éventuellement. Et comment dit-on « actuellement » en anglais ?",fr:"En fait, la plupart des visiteurs viennent d'Australie.",gs:"conf"},
{id:"f3",f:"conf",y:1,t:"mc",q:"The government ___ taxes last year.",o:["raised","rose","risen","arose"],a:0,m:"The government raised taxes last year.",w:"raise a un mot après lui (taxes) : quelqu'un fait monter quelque chose. Sans complément (ce qui complète le verbe ou le nom) : taxes rose.",h2:"Grammaire L1 S2 — The bank raised interest rates ✓ ; Interest rates rose ✓ ; The banks rose interest rates ✗.",hq:"Grammaire L1 S2 — Le gouvernement fait monter quelque chose (taxes) : y a-t-il un mot après le verbe, ou les taxes montent-elles toutes seules ?",nc:"Taxes ___ last year (sans complément [ce qui complète le verbe ou le nom]) ≠ The government ___ taxes (avec complément).",fr:"Le gouvernement a augmenté les impôts l'année dernière.",gs:"conf"},
{id:"f4",f:"conf",y:1,t:"mc",q:"He ___ on the beach all afternoon.",o:["lay","laid","lied","layed"],a:0,m:"He lay on the beach all afternoon.",w:"lie, lay, lain = être allongé (rien après le verbe). lay, laid, laid = poser quelque chose (un objet après le verbe).",h2:"Grammaire L1 S2 — le piège central du chapitre : lay est à la fois l'infinitif (le verbe précédé de to) de « poser » et le prétérit (passé anglais d'un fait terminé) de « être allongé ». Question-test : y a-t-il un complément (ce qui complète le verbe ou le nom) d'objet ?",hq:"Grammaire L1 S2 — Il était allongé : après le verbe du blanc, y a-t-il un complément (ce qui complète le verbe ou le nom) d'objet (un nom comme the towel) ? on the beach n'en est pas un. Quel est le prétérit (passé anglais d'un fait terminé) de lie (être allongé) ?",nc:"lie, ___, lain (être allongé, sans complément [ce qui complète le verbe ou le nom]) ≠ lay, laid, laid (poser quelque chose, avec complément) ≠ lie, lied, lied (mentir).",fr:"Il est resté allongé sur la plage tout l'après-midi.",gs:"conf"},
{id:"f5",f:"conf",y:1,t:"type",q:"Don't ___ your boarding pass.",h:"lose or loose?",a:["lose"],m:"Don't lose your boarding pass.",w:"lose = perdre ; loose = lâche, pas serré.",h2:"Orthographe — lose, lost, lost : un seul o pour le verbe.",hq:"Orthographe — « perdre » : un o ou deux ?",nc:"le verbe « perdre » ≠ l'adjectif (mot qui décrit un nom : grand, utile) « lâche, pas serré ».",fr:"Ne perds pas ta carte d'embarquement.",gs:"conf"},
{id:"f6",f:"conf",y:2,t:"mc",q:"The island has ___ 300 guest rooms.",o:["over","plus","more","above of"],a:0,m:"The island has over 300 guest rooms.",w:"plus de 300 = over 300 ou more than 300.",h2:"Traduction spécialisée L3 S6 — l'omission coûte le maximum de points-fautes : over 2,500 jobs → « 2 500 emplois » ✗ → plus de 2 500 emplois ✓.",hq:"Traduction spécialisée L3 S6 — « plus de 300 chambres » : quel mot rend « plus de » devant un chiffre ? L'oublier, c'est quelle erreur ?",nc:"plus de 300 (au-delà de 300) ≠ 300 (le chiffre exact) : ne rien omettre.",fr:"L'île compte plus de 300 chambres.",gs:"conf"},
{id:"f7",f:"conf",y:2,t:"mc",q:"Bookings fell ___ in July, a small dip.",o:["slightly","lightly","slowly","softly"],a:0,m:"Bookings fell slightly in July, a small dip.",w:"slightly = légèrement. « se sont effondrées » en dirait trop.",h2:"Traduction spécialisée L3 S6 — rose slightly → « a flambé » en dit trop ; → a légèrement augmenté.",hq:"Traduction spécialisée L3 S6 — Une petite baisse : quel adverbe (un mot qui précise le verbe fell) veut dire « légèrement » ? Attention à ne pas exagérer.",nc:"légèrement (une petite baisse) ≠ s'effondrer (trop fort).",fr:"Les réservations ont légèrement baissé en juillet : un petit recul.",gs:"conf"},

{id:"k1",gs:"have",f:"link",y:2,t:"order",a:"Visitor numbers have tripled in ten years, a first for the province.",m:"Visitor numbers have tripled in ten years, a first for the province.",w:"Le fragment « Une première » se rattache à la phrase précédente par une virgule.",h2:"Traduction spécialisée L3 S6 — l'anglais relie les deux segments d'une phrase tronquée par une virgule ou un tiret, plutôt que de reproduire la coupure.",hq:"Traduction spécialisée L3 S6 — « Une première » est un fragment sans verbe : l'anglais le garde-t-il seul, ou le rattache-t-il à la phrase précédente ? Par quel signe ?",nc:"en français, deux phrases (« …en dix ans. Une première. ») ≠ en anglais, une seule phrase.",fr:"Le nombre de visiteurs a triplé en dix ans, une première pour la province."},
{id:"k2",f:"link",y:2,t:"mc",q:"___ the rain, the ferry left on time.",o:["Despite","Although","However","Even"],a:0,m:"Despite the rain, the ferry left on time.",w:"Devant un groupe nominal (the rain) → despite. Although exige un verbe conjugué.",h2:"Traduction L2 S4 — ce qui suit décide, pas le sens : un groupe nominal (un nom et ses petits mots : « la pluie ») appelle la préposition (despite), un verbe conjugué la conjonction (although).",hq:"Traduction L2 S4 — Qu'est-ce qui suit : un groupe nominal (the rain) ou un verbe conjugué ? Préposition (petit mot devant un nom : à, de, pour) ou conjonction ?",nc:"___ the rain (+ groupe nominal [un nom et ses petits mots : « la pluie »]) ≠ ___ it rained (+ verbe conjugué).",fr:"Malgré la pluie, le bateau est parti à l'heure.",gs:"link"},
{id:"k3",f:"link",y:2,t:"mc",q:"The project was shelved ___ the land is prone to flooding.",o:["because","because of","due","despite"],a:0,m:"The project was shelved because the land is prone to flooding.",w:"Devant sujet + verbe conjugué → because. because of + groupe nominal (un nom et ses petits mots : « la pluie »).",h2:"Traduction L2 S4 — parce que + verbe conjugué = because ; à cause de + nom = because of.",hq:"Traduction L2 S4 — Qu'est-ce qui suit : the land is prone… (sujet + verbe conjugué), ou un simple nom ?",nc:"___ the floods (+ groupe nominal [un nom et ses petits mots : « la pluie »]) ≠ ___ the land floods (+ verbe conjugué).",fr:"Le projet a été abandonné parce que le terrain est inondable.",gs:"link"},
{id:"k4",f:"link",y:2,t:"drag",q:"Prices rose. ___, sales fell. ___ prices rose, sales fell.",b:["However","Although","Despite","Because"],a:["However","Although"],m:"Prices rose. However, sales fell. Although prices rose, sales fell.",w:"However ouvre une nouvelle phrase. Although relie deux morceaux de la même phrase.",h2:"Traduction L2 S4 — « Bien que la croissance ait ralenti » → Although growth slowed : le subjonctif (forme après « il faut que ») français disparaît.",hq:"Traduction L2 S4 — Le premier blanc ouvre une nouvelle phrase, après Prices rose. Le second relie, dans la même phrase, prices rose et sales fell (deux morceaux, chacun avec son verbe). Quel mot pour chacun ?",nc:"« cependant » (début de phrase, suivi d'une virgule) ≠ « bien que » (relie deux morceaux de phrase) ≠ « malgré » (+ nom).",fr:"Les prix ont augmenté. Cependant, les ventes ont baissé. Bien que les prix aient augmenté, les ventes ont baissé.",gs:"link"},
{id:"k5",gs:"have",f:"link",y:3,t:"order",a:"The company has cancelled the Sunday crossing, which irritates Lifou residents.",m:"The company has cancelled the Sunday crossing, which irritates Lifou residents.",w:"« Ce qui » en tête de phrase française devient , which à l'intérieur d'une seule phrase anglaise.",h2:"Traduction spécialisée L3 S6 — which doit reprendre un mot déjà présent dans la phrase : jamais en tête de phrase autonome, toujours rattaché par une virgule.",hq:"Traduction spécialisée L3 S6 — « Ce qui » en tête de phrase : l'anglais garde-t-il deux phrases, ou rattache-t-il la seconde par une virgule ?",nc:"« Ce qui irrite les habitants. » (fragment français) ≠ une seule phrase anglaise, avec une virgule.",fr:"La compagnie a supprimé la traversée du dimanche, ce qui irrite les habitants de Lifou."},
{id:"k6",f:"link",y:3,t:"type",q:"Having ___ hard all year, they really want a change of scene.",h:"work",a:["worked"],m:"Having worked hard all year, they really want a change of scene.",w:"Having + participe passé (forme après « j'ai » : mangé, écrit) : worked.",h2:"Traduction L2 S4 — le participe (forme en -ed ou en -ing du verbe) : « Ayant travaillé dur toute l'année » ; en anglais, le participe garde le même sujet que la principale (partie de phrase qui tient seule).",hq:"Traduction L2 S4 — « Ayant travaillé » : having + quelle forme du verbe work ?",nc:"working (en travaillant : en même temps) ≠ having ___ (après avoir travaillé : avant).",fr:"Ayant travaillé dur toute l'année, ils ont vraiment envie de changer d'air.",gs:"link"},

{id:"o1",f:"noun",y:1,t:"mc",q:"___ have tripled since 2016.",o:["Visitor numbers","Visitors numbers","Numbers of visitor","Visitor's numbers"],a:0,m:"Visitor numbers have tripled since 2016.",w:"Le premier nom décrit le second, comme un adjectif (mot qui décrit un nom : grand, utile) : il ne prend pas de s → visitor, pas visitors.",h2:"Grammaire L1 S2 — visitor numbers = un type de chiffre. Le premier mot ne prend pas de s : two horses races ✗ → two horse races ✓.",hq:"Grammaire L1 S2 — Parle-t-on d'un type de chiffre ? Dans N1-N2, N1 prend-il un s ? Le génitif (le 's de la possession) 's convient-il à un type ?",nc:"the number of visitors (of) ≠ visitor ___ (N1-N2 : un type de chiffre) ≠ the visitor's ___ (génitif [le 's de la possession] : un visiteur précis).",fr:"Le nombre de visiteurs a triplé depuis 2016.",gs:"noun"},
{id:"o2",f:"noun",y:1,t:"mc",q:"I bought sandals in ___.",o:["a shoe shop","a shop of shoes","a shoes shop","a shop shoes"],a:0,m:"I bought sandals in a shoe shop.",w:"Un type de magasin → nom composé (deux noms collés : le premier décrit le second) N1-N2, premier nom au singulier : a shoe shop.",h2:"Grammaire L1 S2 — a shoe shop = un type de magasin : le premier mot dit de quel type de magasin il s'agit. C'est toujours le premier mot qui définit le sens du second.",hq:"Grammaire L1 S2 — « un magasin de chaussures » : le nom chaussures se place devant le nom shop (N1-N2). Quand un nom passe devant un autre, N1 prend-il un s ?",nc:"a ___ shop (un type de magasin) ≠ a box of ___ (le contenu).",fr:"J'ai acheté des sandales dans un magasin de chaussures.",gs:"noun"},
{id:"o3",f:"noun",y:1,t:"type",q:"The ___ listen to her stories for hours.",h:"child",a:["children"],m:"The children listen to her stories for hours.",w:"Pluriel irrégulier : child → children, jamais childrens.",h2:"Grammaire L1 S2 — pluriels irréguliers : child/children, person/people, woman/women, man/men.",hq:"Grammaire L1 S2 — child a-t-il un pluriel régulier en -s ? Quel est son pluriel irrégulier ?",nc:"pluriel régulier en -s (students) ≠ pluriel irrégulier (person → people, woman → women, child → ___).",fr:"Les enfants écoutent ses histoires pendant des heures.",gs:"noun"},
{id:"o4",f:"noun",y:1,t:"mc",q:"We are still waiting for ___.",o:["the university's decision","the university decision","the decision of university","the decision's university"],a:0,m:"We are still waiting for the university's decision.",w:"Une institution qui décide → génitif (le 's de la possession) 's.",h2:"Grammaire L1 S2 — le génitif (le 's de la possession) s'emploie quand N1 est un être animé, un moment, un lieu ou une institution : the university's decision.",hq:"Grammaire L1 S2 — N1 (the university) est-il un être animé, un moment, un lieu ou une institution ? Quelle structure, alors ?",nc:"the university___ decision (une institution qui agit) ≠ the table leg / the leg of the table (objet inanimé : pas de 's).",fr:"Nous attendons toujours la décision de l'université.",gs:"noun"},
{id:"o5",f:"noun",y:1,t:"drag",q:"___ meeting was cancelled, so we will talk at ___ meeting.",b:["Yesterday's","Yesterday","next week's","next week"],a:["Yesterday's","next week's"],m:"Yesterday's meeting was cancelled, so we will talk at next week's meeting.",w:"Les expressions de temps prennent 's devant un nom.",h2:"Grammaire L1 S2 — génitif (le 's de la possession) de temps, valeur singularisante : yesterday's news, last week's rain = cette pluie-là.",hq:"Grammaire L1 S2 — yesterday et next week sont des expressions de temps. Devant le nom meeting, quelle marque prennent-elles ?",nc:"I saw her yesterday (adverbe [mot qui précise le verbe : souvent, très], seul, sans nom après) ≠ ___ meeting (génitif [le 's de la possession] de temps, devant le nom meeting).",fr:"La réunion d'hier a été annulée, alors nous en parlerons à la réunion de la semaine prochaine.",gs:"noun"},
{id:"o6",f:"noun",y:2,t:"type",q:"Two ___ run the craft cooperative in Hienghène.",h:"woman",a:["women"],m:"Two women run the craft cooperative in Hienghène.",w:"Pluriel irrégulier : woman → women.",h2:"Grammaire L1 S2 — pluriels irréguliers : woman/women, craftswoman/craftswomen.",hq:"Grammaire L1 S2 — woman a-t-il un pluriel régulier en -s ? Lequel ?",nc:"a woman (singulier) ≠ two ___ (pluriel irrégulier) ; même chose pour man.",fr:"Deux femmes dirigent la coopérative artisanale de Hienghène.",gs:"noun"},

{id:"w1",f:"order",y:1,t:"order",a:"She often takes the ferry to Lifou.",m:"She often takes the ferry to Lifou.",w:"L'adverbe (mot qui précise le verbe : souvent, très) de fréquence (often) se place devant le verbe principal.",h2:"Ordre des mots — sujet + adverbe (mot qui précise le verbe : souvent, très) de fréquence + verbe + complément (ce qui complète le verbe ou le nom) : She often takes the ferry.",hq:"Ordre des mots — Où se place often : devant le verbe principal (takes), après lui, ou en fin de phrase ?",nc:"She is often late (après be) ≠ She often ___ the ferry (devant le verbe principal).",fr:"Elle prend souvent le bateau pour Lifou.",gs:"order"},
{id:"w2",f:"order",y:1,t:"mc",q:"I ___ English series.",o:["really like","like really","like very","very like"],a:0,m:"I really like English series.",w:"Pas d'adverbe (mot qui précise le verbe : souvent, très) entre le verbe et son complément (ce qui complète le verbe ou le nom) d'objet.",h2:"Ordre des mots — I like tea very much ✓ ; I like very much tea ✗.",hq:"Ordre des mots — Peut-on placer un adverbe (mot qui précise le verbe : souvent, très) entre le verbe (like) et son complément (English series) ?",nc:"I like English series very ___ (en fin de phrase) ≠ I ___ like English series (devant le verbe).",fr:"J'aime vraiment les séries anglaises.",gs:"order"},
{id:"w3",f:"order",y:1,t:"order",a:"But in Nouméa, who knows her name?",m:"But in Nouméa, who knows her name?",w:"who est sujet de la question : pas de do ni de does.",h2:"Traduction spécialisée L3 S6 — « Mais, à Nouméa, qui connaît son nom ? » : l'anglais rétablit l'ordre sujet-verbe.",hq:"Traduction spécialisée L3 S6 — who est-il ici le sujet de la question ? Faut-il un auxiliaire (verbe outil : « avoir » dans « j'ai mangé ») do quand who est sujet ?",nc:"Who ___ her name? (who sujet : pas de do) ≠ What ___ she know? (what complément [ce qui complète le verbe ou le nom] : avec does).",fr:"Mais à Nouméa, qui connaît son nom ?",gs:"order"},
{id:"w4",f:"order",y:1,t:"mc",q:"Where ___?",o:["does she live","she lives","lives she","does she lives"],a:0,m:"Where does she live?",w:"Question : does + sujet + base verbale (le verbe tout nu, sans to ni s). Le s est porté par does, pas par live.",h2:"Ordre des mots — l'auxiliaire (verbe outil : « avoir » dans « j'ai mangé ») porte la marque du présent : Where does she live?",hq:"Ordre des mots — Dans une question au présent, quel auxiliaire (verbe outil : « avoir » dans « j'ai mangé ») ? Le verbe live reste-t-il à la base ?",nc:"She lives in Nouméa (affirmative : s sur le verbe) ≠ Where ___ she ___? (question : le s passe sur l'auxiliaire [verbe outil : « avoir » dans « j'ai mangé »]).",fr:"Où habite-t-elle ?",gs:"order"},
{id:"w5",gs:"have",f:"order",y:3,t:"order",a:"The cyclone is said to have killed three people.",m:"The cyclone is said to have killed three people.",w:"is said to + have + participe passé (forme après « j'ai » : mangé, écrit) pour une rumeur sur un fait passé.",h2:"Traduction spécialisée L3 S6 — le conditionnel (forme en would : « je ferais ») français de rumeur (« aurait tué ») ne se rend jamais par would : is said to / is thought to / is alleged to / reportedly.",hq:"Traduction spécialisée L3 S6 — Le conditionnel (forme en would : « je ferais ») de rumeur (« aurait tué ») se rend-il par would ? Quelle structure passive : is ___ to + have + participe passé (forme après « j'ai » : mangé, écrit) ?",nc:"« il tuerait » (hypothèse : would) ≠ « il aurait tué, dit-on » (rumeur non confirmée : jamais would).",fr:"Le cyclone aurait tué trois personnes."}
,{"id": "e1", "f": "prep", "y": 2, "t": "mc", "q": "At 5:12 am ___ April 18, 1906, San Francisco residents were awakened by a tremor.", "o": ["on", "in", "at", "by"], "a": 0, "m": "At 5:12 am on April 18, 1906, San Francisco residents were awakened by a tremor.", "w": "Devant une date précise (un jour), on emploie on : on April 18, on Monday.", "h2": "Anglais B2 — at + heure (at 5:12 am), on + jour ou date (on April 18), in + mois, année, saison (in April, in 1906).", "hq": "Anglais B2 — Le mot qui suit est-il une heure, un jour précis, ou un mois / une année ?", "nc": "___ 5:12 am (une heure) ≠ ___ April 18 (une date) ≠ ___ 1906 (une année).", "fr": "Le 18 avril 1906, à 5 h 12, les habitants de San Francisco furent réveillés par une secousse.","gs":"prep"},
{"id": "e2", "f": "prep", "y": 2, "t": "mc", "q": "San Francisco residents were awakened ___ a 40-second tremor.", "o": ["by", "to", "for", "with"], "a": 0, "m": "San Francisco residents were awakened by a 40-second tremor.", "w": "Au passif (le sujet subit l'action : « est fabriqué »), celui qui fait l'action est introduit par by.", "h2": "Anglais B2 — voix passive (le sujet subit l'action : « est fabriqué ») : be + participe passé (forme après « j'ai » : mangé, écrit) + by + celui qui fait l'action (The residents were awakened by a tremor).", "hq": "Anglais B2 — La phrase est-elle au passif (were awakened) ? Quelle préposition (petit mot devant un nom : à, de, pour) introduit a 40-second tremor, celui qui fait l'action ?", "nc": "awakened ___ a tremor (celui qui fait l'action) ≠ cut ___ a knife (l'instrument).", "fr": "Les habitants de San Francisco furent réveillés par une secousse de 40 secondes.","gs":"prep"},
{"id": "e3", "f": "verb", "y": 2, "t": "mc", "q": "Movement along the San Andreas Fault ___ blame.", "o": ["was to", "was at", "has to", "had to"], "a": 0, "m": "Movement along the San Andreas Fault was to blame.", "w": "Être responsable (d'un fait passé) = be to blame : was to blame.", "h2": "Grammaire L1 S2 — be to + base verbale (le verbe tout nu, sans to ni s) ; l'expression figée be to blame = être en cause, être responsable.", "hq": "Anglais B2 — « être responsable, être en cause » : be + ___ + blame ? Le fait est-il passé ?", "nc": "blame someone (accuser quelqu'un) ≠ be ___ blame (être en cause).", "fr": "La faille de San Andreas était en cause.","gs":"verb"},
{"id": "e4", "f": "art", "y": 2, "t": "mc", "q": "The earthquake happened when ___ North American and Pacific tectonic plates moved past each other.", "o": ["the", "Ø", "two", "a"], "a": 0, "m": "The earthquake happened when the North American and Pacific tectonic plates moved past each other.", "w": "Deux plaques précises, identifiées par leur nom : the.", "h2": "Grammaire L1 S2 — the = ce dont on parle est identifié (the Pacific plate, celle-là) ; Ø = la notion en général.", "hq": "Grammaire L1 S2 — Parle-t-on de plaques tectoniques en général, ou de deux plaques précises, nommées ?", "nc": "___ tectonic plates move slowly (en général) ≠ ___ Pacific plate (celle-là).", "fr": "Le séisme s'est produit quand les plaques nord-américaine et pacifique ont glissé l'une contre l'autre.","gs":"art"},
{"id": "e5", "f": "verb", "y": 3, "t": "mc", "q": "The earthquake is ___ to have measured 8.3 on the Richter scale.", "o": ["estimated", "estimate", "estimating", "estimator"], "a": 0, "m": "The earthquake is estimated to have measured 8.3 on the Richter scale.", "w": "be + participe passé (forme après « j'ai » : mangé, écrit) + to have + participe (forme en -ed ou en -ing du verbe) passé : on estime aujourd'hui un fait passé.", "h2": "Traduction spécialisée L3 S6 — la rumeur et l'estimation : is said / thought / estimated to have + participe passé (forme après « j'ai » : mangé, écrit) = « aurait ».", "hq": "Traduction spécialisée L3 S6 — « Le séisme aurait atteint 8,3 » : is ___ to have measured… Quelle forme du verbe après is ?", "nc": "« on estime » (le séisme est estimé : be + participe passé [forme après « j'ai » : mangé, écrit]) ≠ « il estime » (sujet actif).", "fr": "On estime que le séisme a atteint 8,3 sur l'échelle de Richter.","gs":"verb"},
{"id": "e6", "f": "link", "y": 2, "t": "mc", "q": "Temperatures reached 2,500 degrees Fahrenheit, ___ glass and buckling steel.", "o": ["melting", "melted", "melt", "to melt"], "a": 0, "m": "Temperatures reached 2,500 degrees Fahrenheit, melting glass and buckling steel.", "w": "Après la virgule, le participe (forme en -ed ou en -ing du verbe) en -ing décrit la conséquence (faisant fondre…), en parallèle avec buckling.", "h2": "Traduction L2 S4 — le participe (forme en -ed ou en -ing du verbe) : un morceau de phrase en -ing ajoute une conséquence ou une circonstance au même sujet.", "hq": "Traduction L2 S4 — Le blanc est en parallèle avec buckling : quelle forme du verbe melt ?", "nc": "« faisant fondre le verre » (participe présent [forme en -ing : mangeant]) ≠ « le verre fondu » (participe passé [forme après « j'ai » : mangé, écrit]).", "fr": "Les températures atteignirent 2 500 degrés Fahrenheit, faisant fondre le verre et tordant l'acier.","gs":"link"},
{"id": "e7", "f": "conf", "y": 2, "t": "mc", "q": "In a ___ attempt to contain the fire, firefighters dynamited buildings.", "o": ["desperate", "desesperate", "despairate", "despair"], "a": 0, "m": "In a desperate attempt to contain the fire, firefighters dynamited buildings.", "w": "désespéré = desperate. « desesperate » est un calque (traduction mot à mot du français) de l'orthographe française.", "h2": "Anglais B2 — l'orthographe calquée sur le français : désespéré = desperate.", "hq": "Anglais B2 — Il faut un adjectif (mot qui décrit un nom : grand, utile), un mot qui décrit le nom attempt. Lequel s'écrit à l'anglaise ?", "nc": "despair (le désespoir, nom) ≠ ___ (désespéré, adjectif [mot qui décrit un nom : grand, utile]).", "fr": "Dans une tentative désespérée de contenir l'incendie, les pompiers dynamitèrent des immeubles.","gs":"conf"},
{"id": "e8", "f": "count", "y": 2, "t": "mc", "q": "Residents left, carrying ___ possessions as they could.", "o": ["as many", "as much", "so many", "so much"], "a": 0, "m": "Residents left, carrying as many possessions as they could.", "w": "possessions est dénombrable (pluriel) : as many… as. As much va avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an).", "h2": "Grammaire L1 S2 — many / much : many avec le dénombrable (qu'on peut compter : un, deux, trois) pluriel, much avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an).", "hq": "Grammaire L1 S2 — possessions se compte-t-il (one possession, two possessions) ? Quel quantifieur (mot de quantité : beaucoup, quelques, aucun) va avec ?", "nc": "as ___ luggage as they could (indénombrable [qu'on ne compte pas : ni s, ni a/an]) ≠ as ___ bags as they could (dénombrable [qu'on peut compter : un, deux, trois]).", "fr": "Les habitants partirent en emportant autant d'affaires qu'ils le pouvaient.","gs":"count"},
{"id": "e9", "f": "noun", "y": 2, "t": "mc", "q": "The fire caused an estimated $500 ___ in damage.", "o": ["million", "millions", "billions", "millions of"], "a": 0, "m": "The fire caused an estimated $500 million in damage.", "w": "Après un nombre précis, million ne prend pas de s : 500 million, three million.", "h2": "Grammaire L1 S2 — Two thousand people ≠ thousands of people : après un nombre précis, hundred, thousand, million ne prennent pas de s.", "hq": "Grammaire L1 S2 — Le mot est précédé d'un nombre précis (500) : prend-il un s ?", "nc": "___ of dollars (des millions, sans nombre) ≠ 500 ___ dollars (avec un nombre précis).", "fr": "L'incendie causa des dégâts estimés à 500 millions de dollars.","gs":"noun"},
{"id": "e10", "f": "link", "y": 2, "t": "mc", "q": "___ the official number of casualties was 311, it is now believed that about 3,000 people died.", "o": ["Although", "However", "Nonetheless", "Before"], "a": 0, "m": "Although the official number of casualties was 311, it is now believed that about 3,000 people died.", "w": "Although relie deux morceaux de la même phrase (bien que…, …). However ouvre une phrase nouvelle.", "h2": "Traduction L2 S4 — bien que + sujet + verbe = although ; cependant = however, en début de phrase, suivi d'une virgule.", "hq": "Traduction L2 S4 — Le mot relie-t-il deux morceaux d'une seule phrase, ou ouvre-t-il une phrase nouvelle après un point ?", "nc": "« Bien que le bilan (ce qui reste aujourd'hui d'une action passée) officiel… » (relie deux morceaux de phrase) ≠ « Cependant, … » (début de phrase).", "fr": "Bien que le bilan officiel ait été de 311 victimes, on pense aujourd'hui qu'environ 3 000 personnes sont mortes.","gs":"link"},
{"id": "e11", "f": "noun", "y": 2, "t": "mc", "q": "About 250,000 people, two-thirds of the ___ population, were left homeless.", "o": ["city's", "city", "cities", "cities'"], "a": 0, "m": "About 250,000 people, two-thirds of the city's population, were left homeless.", "w": "Un lieu, une ville : génitif (le 's de la possession) 's (la population de la ville). Une seule ville : city's.", "h2": "Grammaire L1 S2 — le génitif (le 's de la possession) s'emploie quand N1 est un être animé, un moment, un lieu ou une institution.", "hq": "Grammaire L1 S2 — N1 (city) est-il un lieu ? Une seule ville ou plusieurs ?", "nc": "the ___ population (une ville) ≠ the ___ populations (plusieurs villes : s').", "fr": "Environ 250 000 personnes, soit les deux tiers de la population de la ville, se retrouvèrent sans abri.","gs":"noun"},
{"id": "e12", "f": "agr", "y": 2, "t": "mc", "q": "Their house and many possessions ___ damaged.", "o": ["were", "was", "went", "come"], "a": 0, "m": "Their house and many possessions were damaged.", "w": "Deux sujets coordonnés par and (house and possessions) : verbe au pluriel → were.", "h2": "Grammaire L1 S2 — deux sujets reliés par and donnent un sujet pluriel.", "hq": "Grammaire L1 S2 — Avant le blanc, combien de noms sujets : their house seul, ou their house and many possessions ? Singulier ou pluriel ?", "nc": "Their house ___ damaged (un sujet) ≠ Their house and many possessions ___ damaged (deux sujets).", "fr": "Leur maison et beaucoup de leurs affaires furent endommagées.","gs":"agr"},
{"id": "e13", "f": "count", "y": 2, "t": "mc", "q": "The Old Mint survived with little ___.", "o": ["damage", "domage", "damages", "disasters"], "a": 0, "m": "The Old Mint survived with little damage.", "w": "Les dégâts = damage, indénombrable (qu'on ne compte pas : ni s, ni a/an), sans s. « domage » est un calque (traduction mot à mot du français) de l'orthographe française.", "h2": "Grammaire L1 S2 — damage (les dégâts) est indénombrable (qu'on ne compte pas : ni s, ni a/an) : little damage, much damage.", "hq": "Grammaire L1 S2 — little va avec un nom indénombrable (qu'on ne compte pas : ni s, ni a/an) : quel mot, et quelle orthographe anglaise ?", "nc": "« dommage » (français) ≠ ___ (anglais, sans s).", "fr": "L'Hôtel de la Monnaie survécut avec peu de dégâts.","gs":"count"},
{"id": "e14", "f": "count", "y": 2, "t": "mc", "q": "Apart from its windows, the Mint suffered ___ damage.", "o": ["little", "a few", "much", "many"], "a": 0, "m": "Apart from its windows, the Mint suffered little damage.", "w": "damage est indénombrable (qu'on ne compte pas : ni s, ni a/an), et le sens est « peu de » (négatif) : little.", "h2": "Grammaire L1 S2 — few / a few avec le dénombrable (qu'on peut compter : un, deux, trois) ; little / a little avec l'indénombrable (qu'on ne compte pas : ni s, ni a/an).", "hq": "Grammaire L1 S2 — damage est-il dénombrable (qu'on peut compter : un, deux, trois) ? Le sens est-il « peu de dégâts » ou « beaucoup » ?", "nc": "___ windows (dénombrable [qu'on peut compter : un, deux, trois]) ≠ ___ damage (indénombrable [qu'on ne compte pas : ni s, ni a/an]).", "fr": "À part ses fenêtres, l'Hôtel de la Monnaie subit peu de dégâts.","gs":"count"},
{"id": "e15", "f": "tense", "y": 2, "t": "mc", "q": "I had just finished my meal when the bell ___.", "o": ["rang", "rings", "is ringing", "was ringed"], "a": 0, "m": "I had just finished my meal when the bell rang.", "w": "Récit au passé : had finished (antériorité) puis rang (prétérit [passé anglais d'un fait terminé] de ring). « ringed » n'existe pas pour une sonnerie.", "h2": "Grammaire L1 S2 — HAVE-EN (have + participe passé : have worked) au passé (had finished) marque l'antériorité ; l'événement suivant est au prétérit (passé anglais d'un fait terminé).", "hq": "Grammaire L1 S2 — Le récit est au passé : quel est le prétérit (passé anglais d'un fait terminé) irrégulier de ring ?", "nc": "had ___ (participe passé [forme après « j'ai » : mangé, écrit] : rung) ≠ the bell ___ (prétérit [passé anglais d'un fait terminé]).", "fr": "Je venais de finir mon repas quand la sonnerie retentit.","gs":"tense"},
{"id": "e16", "f": "verb", "y": 2, "t": "mc", "q": "If you can't do it yourself, have it ___ by somebody else.", "o": ["done", "doing", "to do", "do"], "a": 0, "m": "If you can't do it yourself, have it done by somebody else.", "w": "Faire faire quelque chose par quelqu'un : have + objet + participe passé (forme après « j'ai » : mangé, écrit).", "h2": "Anglais B2 — have something done = faire faire quelque chose (I had my car repaired).", "hq": "Anglais B2 — « fais-le faire par quelqu'un d'autre » : have it + quelle forme du verbe do ?", "nc": "have it ___ (faire faire) ≠ have to ___ (devoir faire).", "fr": "Si tu ne peux pas le faire toi-même, fais-le faire par quelqu'un d'autre.","gs":"verb"},
