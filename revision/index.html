{"id": "e17", "f": "conf", "y": 2, "t": "mc", "q": "'I wouldn't give a thought to the incident.' 'Don't ___ trouble you!'", "o": ["let it", "leave it", "allow it", "it"], "a": 0, "m": "'I wouldn't give a thought to the incident.' 'Don't let it trouble you!'", "w": "Laisser (permettre) + base verbale (le verbe tout nu, sans to ni s) = let : don't let it trouble you.", "h2": "Grammaire L1 S2 — LET = permettre, laisser faire (let me know) ; LEAVE = quitter, abandonner, déposer.", "hq": "Grammaire L1 S2 — « Ne le laisse pas te tracasser » : laisser au sens de permettre ou au sens de quitter ?", "nc": "___ me know (laisser = permettre) ≠ ___ the office (laisser = quitter).", "fr": "« À ta place, je n'y penserais plus. » « Ne te laisse pas tracasser par ça ! »","gs":"conf"},
{"id": "e18", "f": "none", "y": 2, "t": "mc", "q": "'Can I have some more coffee?' 'I'm afraid there's none ___.'", "o": ["left", "to leave", "leaving", "been left"], "a": 0, "m": "'Can I have some more coffee?' 'I'm afraid there's none left.'", "w": "Il n'en reste plus = there is none left (participe passé [forme après « j'ai » : mangé, écrit] de leave).", "h2": "Grammaire L1 S2 — NONE reprend un nom cité (coffee) ; there's none left = il n'en reste plus.", "hq": "Grammaire L1 S2 — « il n'en reste plus » : none + quelle forme du verbe leave ?", "nc": "there is none ___ (il n'en reste plus) ≠ I have to ___ (je dois partir).", "fr": "« Je peux avoir encore du café ? » « Je crains qu'il n'en reste plus. »","gs":"none"},
{"id": "e19", "f": "verb", "y": 2, "t": "mc", "q": "___ conferences is a good way to meet people and build business relationships.", "o": ["Attending", "To visit", "Going", "To attend"], "a": 0, "m": "Attending conferences is a good way to meet people and build business relationships.", "w": "Un verbe sujet de la phrase se met en -ing (le gérondif [verbe en -ing employé comme un nom]) : Attending conferences is…", "h2": "Grammaire L1 S2 — le gérondif (verbe en -ing employé comme un nom) : un verbe en -ing peut être sujet de la phrase, comme un nom.", "hq": "Grammaire L1 S2 — Le blanc est le sujet de is : quelle forme du verbe peut jouer le rôle d'un nom ? Et « assister à » se dit-il go ?", "nc": "« assister à une conférence » (attend, sans préposition [petit mot devant un nom : à, de, pour]) ≠ « aller à une conférence » (go to).", "fr": "Assister à des conférences est un bon moyen de rencontrer des gens et de nouer des relations d'affaires.","gs":"verb"},
{"id": "e20", "f": "prep", "y": 2, "t": "mc", "q": "Sometimes we are very busy and we have meetings ___ night.", "o": ["at", "in", "for", "to"], "a": 0, "m": "Sometimes we are very busy and we have meetings at night.", "w": "La nuit (moment de la journée) : at night. Mais in the morning, in the evening.", "h2": "Anglais B2 — at night, at noon, at the weekend ; in the morning, in the afternoon, in the evening.", "hq": "Anglais B2 — night se construit-il comme morning et evening ?", "nc": "___ the evening ≠ ___ night.", "fr": "Parfois, nous sommes très occupés et nous avons des réunions la nuit.","gs":"prep"},
{"id": "e21", "f": "verb", "y": 2, "t": "mc", "q": "She asked them to avoid ___ late.", "o": ["being", "to be", "their being", "they should be"], "a": 0, "m": "She asked them to avoid being late.", "w": "avoid se construit avec V-ing (verbe + -ing : working) : avoid being late.", "h2": "Grammaire L1 S2 — avoid, suggest, admit, recommend + V-ing (verbe + -ing : working).", "hq": "Grammaire L1 S2 — avoid se construit-il avec to + infinitif (le verbe précédé de to), ou avec V-ing (verbe + -ing : working) ?", "nc": "decide to ___ late (to + infinitif [le verbe précédé de to]) ≠ avoid ___ late (V-ing [verbe + -ing : working]).", "fr": "Elle leur a demandé d'éviter d'être en retard.","gs":"verb"},
{"id": "e22", "gs": "have", "f": "tense", "y": 3, "t": "mc", "q": "If he ___ one minute later, he would have missed the train.", "o": ["had arrived", "arrived", "would have arrived", "would arrive"], "a": 0, "m": "If he had arrived one minute later, he would have missed the train.", "w": "Hypothèse dans le passé (irréel) : if + had + participe passé (forme après « j'ai » : mangé, écrit), puis would have + participe (forme en -ed ou en -ing du verbe) passé.", "h2": "Anglais B2 — irréel du passé : If + past perfect (had arrived), would have + participe passé (forme après « j'ai » : mangé, écrit).", "hq": "Anglais B2 — La situation est passée et ne s'est pas produite : quel temps après if ? would peut-il suivre if ?", "nc": "If he ___ later (irréel du présent) ≠ If he ___ later (irréel du passé).", "fr": "S'il était arrivé une minute plus tard, il aurait raté le train."},
{"id": "e23", "f": "noun", "y": 2, "t": "mc", "q": "Britain's biggest retailer already has ___ mobile phone customers.", "o": ["three million", "three millions", "three million of", "millions"], "a": 0, "m": "Britain's biggest retailer already has three million mobile phone customers.", "w": "Après un nombre précis, million ne prend pas de s et se construit sans of : three million customers.", "h2": "Grammaire L1 S2 — Two thousand people ≠ thousands of people.", "hq": "Grammaire L1 S2 — Le nombre est-il précis (three) ? million prend-il alors un s, ou of ?", "nc": "___ of customers (des millions, sans nombre précis) ≠ three ___ customers.", "fr": "Le plus grand distributeur britannique a déjà trois millions d'abonnés au téléphone mobile.","gs":"noun"},
{"id": "e24", "f": "prep", "y": 2, "t": "mc", "q": "These candy bars account ___ about 70% of our sales.", "o": ["for", "to", "with", "by"], "a": 0, "m": "These candy bars account for about 70% of our sales.", "w": "représenter (une part) = account for.", "h2": "Grammaire L1 S2 — les verbes prépositionnels : la préposition (petit mot devant un nom : à, de, pour) fait partie du verbe (depend on, account for).", "hq": "Grammaire L1 S2 — « représenter 70 % des ventes » : account + quelle préposition (petit mot devant un nom : à, de, pour) ?", "nc": "account ___ 70% (représenter) ≠ depend ___ sales (dépendre de).", "fr": "Ces barres chocolatées représentent environ 70 % de nos ventes.","gs":"prep"},
{"id": "e25", "f": "rel", "y": 2, "t": "mc", "q": "A marketing campaign ___ is well-done and fashionable will attract more customers.", "o": ["that", "what", "who", "it"], "a": 0, "m": "A marketing campaign that is well-done and fashionable will attract more customers.", "w": "Relatif sujet pour une chose : that (ou which). Who est réservé aux personnes ; what ne suit jamais un nom.", "h2": "Grammaire L1 S2 — who pour les personnes, which / that pour les choses ; what = ce que, sans nom avant.", "hq": "Grammaire L1 S2 — Le nom que remplace le relatif (a campaign) est-il une personne ou une chose ? what peut-il suivre un nom ?", "nc": "a manager ___ is creative (une personne) ≠ a campaign ___ is creative (une chose).", "fr": "Une campagne marketing réussie et à la mode attirera davantage de clients.","gs":"rel"},
{"id": "e26", "f": "verb", "y": 3, "t": "mc", "q": "Europe will need to continue ___ coal over the next few years.", "o": ["burning", "burn", "burned", "burner"], "a": 0, "m": "Europe will need to continue burning coal over the next few years.", "w": "continue + V-ing (ou to + base verbale [le verbe tout nu, sans to ni s]) ; burned et burner sont impossibles.", "h2": "Grammaire L1 S2 — après certains verbes (continue, keep, stop, avoid), le verbe suivant se met en -ing.", "hq": "Grammaire L1 S2 — Après continue, quelle forme du verbe burn ?", "nc": "keep ___ coal (V-ing [verbe + -ing : working]) ≠ the coal ___ (prétérit [passé anglais d'un fait terminé] / participe passé [forme après « j'ai » : mangé, écrit]).", "fr": "L'Europe devra continuer à brûler du charbon au cours des prochaines années.","gs":"verb"},
{"id": "e27", "f": "order", "y": 3, "t": "mc", "q": "Europe will continue burning coal over the ___ years.", "o": ["next few", "few next", "several next", "proximal"], "a": 0, "m": "Europe will continue burning coal over the next few years.", "w": "L'ordre anglais est next few (les quelques prochaines), à l'inverse du français.", "h2": "Anglais B2 — ordre des mots : the next few years, the last two weeks, the first three days.", "hq": "Anglais B2 — « les prochaines années » : dans quel ordre placer next et few ?", "nc": "the ___ years (les quelques prochaines) ≠ the ___ days (les trois premiers : first three).", "fr": "L'Europe continuera à brûler du charbon au cours des prochaines années.","gs":"order"},
{"id": "e28", "f": "conf", "y": 3, "t": "mc", "q": "The disruption of Russian gas exports has ___ an energy crunch.", "o": ["triggered", "provoqued", "conducted to", "lead to"], "a": 0, "m": "The disruption of Russian gas exports has triggered an energy crunch.", "w": "provoquer, déclencher = trigger. « provoqued » et « conducted to » sont des calques (traductions mot à mot du français) du français.", "h2": "Traduction spécialisée L3 S6 — le calque (traduction mot à mot du français) : traduction littérale aberrante, qui ne serait pas naturelle pour un natif.", "hq": "Traduction spécialisée L3 S6 — Quel verbe anglais veut dire « déclencher » ? Lequel des quatre est un calque (traduction mot à mot du français) du français ?", "nc": "« provoquer » (français) ≠ ___ (anglais) ; « conduire à » ≠ lead to (et has led to).", "fr": "L'interruption des exportations de gaz russe a déclenché une crise énergétique.","gs":"conf"},
{"id": "e29", "f": "tense", "y": 3, "t": "mc", "q": "There have been price spikes unlike anything seen ___ 1973.", "o": ["since", "from", "until", "to"], "a": 0, "m": "There have been price spikes unlike anything seen since 1973.", "w": "Point de départ jusqu'à aujourd'hui : since + date.", "h2": "Grammaire L1 S2 — since + point de départ (since 1973) ; for + durée.", "hq": "Grammaire L1 S2 — 1973 est-il un point de départ ou une durée ? Va-t-on jusqu'à aujourd'hui ?", "nc": "___ 1973 (depuis : jusqu'à aujourd'hui) ≠ ___ 1973 to 1975 (de… à…).", "fr": "On a vu des flambées des prix sans équivalent depuis 1973.","gs":"tense"},
{"id": "e30", "f": "conf", "y": 3, "t": "mc", "q": "The crucial question is ___ they can manage through the winter.", "o": ["whether", "weather", "whenever", "why"], "a": 0, "m": "The crucial question is whether they can manage through the winter.", "w": "si (dans une question indirecte) = whether. weather = le temps qu'il fait.", "h2": "Anglais B2 — whether = si (choix entre oui et non) ; weather = la météo : même prononciation, deux mots.", "hq": "Anglais B2 — Le sens est-il « si » (oui ou non) ou « la météo » ?", "nc": "the ___ is cold (la météo) ≠ the question is ___ (si…).", "fr": "La question cruciale est de savoir s'ils pourront tenir pendant l'hiver.","gs":"conf"},
{"id": "e31", "f": "link", "y": 3, "t": "mc", "q": "The answer is probably yes, ___ that Europeans maximize the use of other energy sources.", "o": ["provided", "conditionally", "with condition", "conditioned"], "a": 0, "m": "The answer is probably yes, provided that Europeans maximize the use of other energy sources.", "w": "à condition que = provided (that).", "h2": "Traduction L2 S4 — les connecteurs (mots de liaison : cependant, donc) logiques : condition = provided (that), as long as.", "hq": "Traduction L2 S4 — « à condition que » : quel connecteur (mot de liaison : cependant, donc) anglais introduit une condition ?", "nc": "___ that (à condition que) ≠ unless (à moins que).", "fr": "La réponse est probablement oui, à condition que les Européens utilisent au maximum les autres sources d'énergie.","gs":"link"},
{"id": "e32", "f": "conf", "y": 3, "t": "mc", "q": "Subsidizing fossil-fuel ___ will only aggravate inflation.", "o": ["consumption", "consommation", "consumation", "consume"], "a": 0, "m": "Subsidizing fossil-fuel consumption will only aggravate inflation.", "w": "la consommation = consumption. « consommation » est le mot français.", "h2": "Traduction spécialisée L3 S6 — le calque (traduction mot à mot du français) et l'orthographe calquée sur le français.", "hq": "Traduction spécialisée L3 S6 — Après fossil-fuel, il faut un nom : complément (ce qui complète le verbe ou le nom) de subsidizing (subventionner la consommation). Quel mot anglais correspond à « la consommation » ?", "nc": "consume (le verbe) ≠ ___ (le nom).", "fr": "Subventionner la consommation d'énergies fossiles ne fera qu'aggraver l'inflation.","gs":"conf"},
{"id": "e33", "f": "noun", "y": 3, "t": "mc", "q": "The EU would be one of the leading major ___ in the green transition.", "o": ["economies", "economy", "economics", "economist"], "a": 0, "m": "The EU would be one of the leading major economies in the green transition.", "w": "one of the + nom au pluriel : one of the leading economies.", "h2": "Anglais B2 — one of the + pluriel (one of the best students).", "hq": "Anglais B2 — Après one of the, le nom est-il au singulier ou au pluriel ? Et economics, est-ce une économie ?", "nc": "economics (la science économique) ≠ ___ (les économies, les pays).", "fr": "L'UE serait l'une des grandes économies en tête de la transition écologique.","gs":"noun"},
{"id": "e34", "f": "tense", "y": 3, "t": "mc", "q": "The European Union has ___ the last few months imposing sanctions on Russia.", "o": ["spent", "spending", "spend", "spended"], "a": 0, "m": "The European Union has spent the last few months imposing sanctions on Russia.", "w": "has + participe passé (forme après « j'ai » : mangé, écrit) : spend, spent, spent (verbe irrégulier). « spended » n'existe pas.", "h2": "Grammaire L1 S2 — HAVE-EN (have + participe passé : have worked) : has + participe passé (forme après « j'ai » : mangé, écrit) ; spend, spent, spent est irrégulier.", "hq": "Grammaire L1 S2 — Après has, quelle forme du verbe ? spend est-il régulier ?", "nc": "has ___ (participe passé [forme après « j'ai » : mangé, écrit]) ≠ is ___ (V-ing [verbe + -ing : working]).", "fr": "L'Union européenne a passé ces derniers mois à imposer des sanctions à la Russie.","gs":"tense"},
{"id": "e35", "f": "conf", "y": 3, "t": "mc", "q": "Brussels is diversifying its basket of energy ___.", "o": ["providers", "furnishers", "furbishers", "providees"], "a": 0, "m": "Brussels is diversifying its basket of energy providers.", "w": "les fournisseurs = providers (ou suppliers). « furnishers » est un calque (traduction mot à mot du français) de « fournisseurs ».", "h2": "Traduction spécialisée L3 S6 — le calque (traduction mot à mot du français) : le mot ressemble au français mais ne se dit pas en anglais.", "hq": "Traduction spécialisée L3 S6 — Quel mot anglais veut dire « fournisseurs » ? Lequel est un calque (traduction mot à mot du français) ?", "nc": "« fournisseurs » (français) ≠ ___ / suppliers (anglais).", "fr": "Bruxelles diversifie son panier de fournisseurs d'énergie.","gs":"conf"}
,{"id": "vg1", "f": "vague", "y": 2, "t": "type", "q": "The company has a ___ market share.", "m": "The company has a substantial market share.", "w": "big est vague. On dit a substantial (significant, sizeable) market share.", "h2": "Business English L2 S4 — Ne pas utiliser de mot vague. Utiliser un mot précis : big → substantial, small → minor, important → essential to.", "hq": "big ne dit rien de la taille réelle. Quel adjectif (mot qui décrit un nom : grand, utile) du cours va avec market share ?", "nc": "a ___ market share (précis) ≠ a big market share (vague, oral).", "fr": "L'entreprise détient une part de marché importante.", "a": ["substantial", "significant", "sizeable", "considerable"], "h": "un adjectif précis, pas big","gs":"vague"},{"id": "vg2", "f": "vague", "y": 2, "t": "mc", "q": "Our products are ___ our clients.", "m": "Our products are essential to our clients.", "w": "important for est vague et calqué sur « important pour ». essential to (ou matter to) dit pourquoi ça compte.", "h2": "Business English L2 S4 — important → essential to / crucial to / matter to. Attention à la préposition (petit mot devant un nom : à, de, pour) : to.", "hq": "Quel adjectif (mot qui décrit un nom : grand, utile) plus fort que important ? Et quelle préposition (petit mot devant un nom : à, de, pour) le suit ?", "nc": "important pour (français) ≠ ___ (anglais précis, avec to).", "fr": "Nos produits sont indispensables à nos clients.", "o": ["essential to", "important for", "crucially for", "necessary at"], "a": 0,"gs":"vague"},{"id": "vg3", "f": "vague", "y": 2, "t": "mc", "q": "They ___ considerable effort to customer service.", "m": "They devote considerable effort to customer service.", "w": "do a lot of work est vague. devote considerable effort to = consacrer des efforts importants à.", "h2": "Business English L2 S4 — Ne pas utiliser make, do, have. Utiliser un verbe précis : do a lot of work → devote considerable effort to ; make changes → implement changes.", "hq": "« consacrer des efforts à » : quel verbe se construit avec effort … to ?", "nc": "do a lot of work on (vague) ≠ ___ considerable effort to (précis).", "fr": "Ils consacrent des efforts considérables au service client.", "o": ["devote", "provide", "perform", "operate"], "a": 0,"gs":"vague"},{"id": "vg4", "f": "vague", "y": 2, "t": "mc", "q": "This resource is ___ our company: nobody can copy it easily.", "m": "This resource is unique to our company: nobody can copy it easily.", "w": "unique est déjà absolu : very unique est redondant. On dit unique to.", "h2": "Business English L2 S4 — VRIO : very unique ✗ → unique to ✓. Un adjectif absolu (qui ne peut pas être « plus ou moins » : unique, parfait) ne prend pas very.", "hq": "unique peut-il être plus ou moins unique ? Et quelle préposition (petit mot devant un nom : à, de, pour) le suit ?", "nc": "very unique (redondant) ≠ ___ our company (précis).", "fr": "Cette ressource est propre à notre entreprise : personne ne peut la copier facilement.", "o": ["unique to", "very unique for", "so unique at", "uniquely for"], "a": 0,"gs":"vague"},{"id": "vg5", "f": "vague", "y": 2, "t": "mc", "q": "This capability gives us a competitive ___ over our rivals.", "m": "This capability gives us a competitive edge over our rivals.", "w": "gives us benefit est vague. a competitive edge (ou advantage) over = un avantage concurrentiel sur.", "h2": "Business English L2 S4 — a competitive edge / advantage over… ; « makes us better » est trop vague.", "hq": "Quelle collocation (mots qui vont ensemble par habitude) du cours avec competitive veut dire « avantage » ?", "nc": "a ___ / advantage over (collocation [mots qui vont ensemble par habitude]) ≠ force (calque [traduction mot à mot du français] de « force »).", "fr": "Cette capacité nous donne un avantage concurrentiel sur nos rivaux.", "o": ["edge", "benefit", "goodness", "force"], "a": 0,"gs":"vague"},{"id": "vg6", "f": "vague", "y": 2, "t": "order", "q": "", "m": "The team produced a detailed report on customer insights.", "w": "made a report est vague. On produce (ou draw up) a report.", "h2": "Business English L2 S4 — made a report → produced a report ; made changes → implemented changes.", "hq": "Quel verbe plus précis que made pour un rapport ?", "nc": "made a detailed report (vague) ≠ ___ a detailed report (précis).", "fr": "L'équipe a rédigé un rapport détaillé sur les attentes des clients.", "a": "The team produced a detailed report on customer insights.","gs":"vague"},{"id": "vg7", "f": "vague", "y": 1, "t": "mc", "q": "Polk is ___ one of the most expansionist presidents.", "m": "Polk is regarded as one of the most expansionist presidents.", "w": "« Polk was a very important president » est vide. is regarded as dit comment on le juge. Et « comme » se dit as, pas like.", "h2": "Civilisation USA L1 S1 — « On le considère comme… » → is considered, is regarded as, is seen as, is recognised as.", "hq": "« considéré comme » : comme se traduit-il par like ou par as après ces verbes ?", "nc": "comme (= en tant que) → as ≠ like (= qui ressemble à).", "fr": "Polk est considéré comme l'un des présidents les plus expansionnistes.", "o": ["regarded as", "regarded like", "considered like", "seen like"], "a": 0,"gs":"vague"},{"id": "vg8", "f": "vague", "y": 1, "t": "type", "q": "Distance was the main ___ that Americans had to overcome.", "m": "Distance was the main challenge that Americans had to overcome.", "w": "thing ou problem ne disent rien. challenge (ou obstacle) va avec overcome.", "h2": "Civilisation USA L1 S1 — Distance is the fundamental challenge of American civilization (CM 2).", "hq": "Quel nom va naturellement avec overcome (surmonter) ?", "nc": "a big problem (vague) ≠ the main ___ (précis).", "fr": "La distance était le principal défi que les Américains devaient surmonter.", "a": ["challenge", "obstacle"], "h": "un nom précis, pas thing ni problem","gs":"vague"},{"id": "vg9", "f": "vague", "y": 1, "t": "type", "q": "The Rust Belt was ___ hit by factory closures.", "m": "The Rust Belt was severely hit by factory closures.", "w": "very ne va pas avec un participe (forme en -ed ou en -ing du verbe) comme hit. severely (badly, heavily) dit la force du choc.", "h2": "Civilisation USA L1 S1 — Kill the weak construction : very + adjectif (mot qui décrit un nom : grand, utile) → un adverbe (mot qui précise le verbe : souvent, très) ou un verbe précis (devastated, ravaged).", "hq": "very peut-il précéder hit ? Quel adverbe (mot qui précise le verbe : souvent, très) dit « durement » ?", "nc": "very hit ✗ ≠ ___ hit ✓.", "fr": "La Rust Belt a été durement touchée par les fermetures d'usines.", "a": ["severely", "badly", "heavily", "hard"], "h": "un adverbe précis, pas very","gs":"vague"},{"id": "vg10", "f": "vague", "y": 2, "t": "type", "q": "Differentiation is a ___ choice for a small company.", "m": "Differentiation is a sound choice for a small company.", "w": "good est vide. a sound (wise, viable) choice dit en quoi le choix est bon.", "h2": "Business English L2 S4 — good → sound, viable, effective ; bad → poor, flawed.", "hq": "good ne dit pas pourquoi. Quel adjectif (mot qui décrit un nom : grand, utile) veut dire « solide, judicieux » ?", "nc": "a good choice (vague) ≠ a ___ choice (précis).", "fr": "La différenciation est un choix judicieux pour une petite entreprise.", "a": ["sound", "wise", "smart", "sensible", "viable", "judicious"], "h": "un adjectif précis, pas good","gs":"vague"},{"id": "fv1", "f": "full", "y": 1, "t": "drag", "q": "The Southeast ___ hurricanes, while the Midwest ___ five Great Lakes.", "m": "The Southeast is prone to hurricanes, while the Midwest is home to five Great Lakes.", "w": "has et there are sont vides. is prone to = subir (un risque) ; is home to = abriter.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser HAVE. Utiliser un vrai verbe d'action : contenir → is home to, contains, hosts ; subir → is prone to, faces, is plagued by.", "hq": "Premier blanc : la région subit-elle ou abrite-t-elle ? Second blanc : même question.", "nc": "subir un risque : is ___ ≠ abriter : is ___ .", "fr": "Le Sud-Est est exposé aux ouragans, tandis que le Midwest abrite cinq Grands Lacs.", "b": ["is prone to", "is home to", "has", "there are"], "a": ["is prone to", "is home to"],"gs":"full"},{"id": "fv2", "f": "full", "y": 1, "t": "mc", "q": "Texas ___ cattle ranching in the United States.", "m": "Texas dominates cattle ranching in the United States.", "w": "« Texas is the most important state for… » est vide. dominates dit la place de leader.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser BE. Utiliser un vrai verbe d'action, pour dire « être premier en » : dominates, leads, surpasses, ranks as, has emerged as.", "hq": "Quel verbe dit « être le premier, le leader » ?", "nc": "is the most important state for (vague) ≠ ___ (vrai verbe d'action [verbe au sens précis, pas be, have, make, do]).", "fr": "Le Texas domine l'élevage bovin aux États-Unis.", "o": ["dominates", "is important", "has", "is the best in"], "a": 0,"gs":"full"},{"id": "fv3", "f": "full", "y": 1, "t": "type", "q": "The South ___ cotton, tobacco and citrus fruits.", "m": "The South produces cotton, tobacco and citrus fruits.", "w": "« The South has a lot of cotton » est vide. produces (grows, yields) dit ce que fait la région.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser HAVE. Utiliser un vrai verbe d'action, pour dire « produire » : produces, yields, generates, supplies, cultivates.", "hq": "La région ne possède pas le coton : que fait-elle ?", "nc": "has a lot of (vague) ≠ ___ (vrai verbe d'action [verbe au sens précis, pas be, have, make, do]).", "fr": "Le Sud produit du coton, du tabac et des agrumes.", "a": ["produces", "grows", "yields", "cultivates"], "h": "un verbe précis, pas has","gs":"full"},{"id": "fv4", "f": "full", "y": 1, "t": "order", "q": "", "m": "Jazz, blues and country music originated in the South.", "w": "« The South is where jazz is from » est vide. originated in (emerged from) dit l'origine.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser BE. Utiliser un vrai verbe d'action, pour dire « origine » : is the birthplace of, originated in, emerged from, stems from.", "hq": "Quel verbe d'origine, et avec quelle préposition (petit mot devant un nom : à, de, pour) ?", "nc": "are from (vague) ≠ ___ in (vrai verbe d'action [verbe au sens précis, pas be, have, make, do]).", "fr": "Le jazz, le blues et la country sont nés dans le Sud.", "a": "Jazz, blues and country music originated in the South.","gs":"full"},{"id": "fv5", "f": "full", "y": 1, "t": "mc", "q": "Hurricane Katrina ___ New Orleans in 2005.", "m": "Hurricane Katrina devastated New Orleans in 2005.", "w": "« was a disaster that was very destructive for » est vide. devastated dit l'action.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser BE. Utiliser un vrai verbe d'action, pour dire « risque, dégât » : devastated, ravaged, threatened, frequently affects.", "hq": "Quel verbe dit en un mot « a ravagé » ? Prend-il une préposition (petit mot devant un nom : à, de, pour) ?", "nc": "destroy ___ (pas de préposition [petit mot devant un nom : à, de, pour]) ≠ « détruire de » (calque [traduction mot à mot du français]).", "fr": "L'ouragan Katrina a ravagé La Nouvelle-Orléans en 2005.", "o": ["devastated", "was a disaster for", "had bad effects on", "destroyed of"], "a": 0,"gs":"full"},{"id": "fv6", "f": "full", "y": 1, "t": "mc", "q": "The decline of the Rust Belt ___ factory closures since the 1960s.", "m": "The decline of the Rust Belt stems from factory closures since the 1960s.", "w": "is the result of = BE + nom. stems from (ou results from) porte la relation de cause.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser is the cause of, is the result of. Utiliser un vrai verbe d'action : is the cause of → caused ; is the result of → stems from, results from.", "hq": "Quel verbe dit « provient de, découle de » ? Avec quelle préposition (petit mot devant un nom : à, de, pour) ?", "nc": "results ___ (la cause) ≠ results in (la conséquence).", "fr": "Le déclin de la Rust Belt découle des fermetures d'usines depuis les années 1960.", "o": ["stems from", "is the result of", "comes of", "results of"], "a": 0,"gs":"full"},{"id": "fv7", "f": "full", "y": 1, "t": "mc", "q": "Slavery ___ enormous suffering in the antebellum South.", "m": "Slavery caused enormous suffering in the antebellum South.", "w": "« was the cause of » est lourd. caused (ou inflicted) dit l'action directement.", "h2": "Civilisation USA L1 S1 — is the cause of → caused, triggered, inflicted, fueled.", "hq": "Quel verbe remplace « était la cause de » en un mot ?", "nc": "was the cause of (lourd) ≠ ___ (vrai verbe d'action [verbe au sens précis, pas be, have, make, do]).", "fr": "L'esclavage a causé d'immenses souffrances dans le Sud d'avant-guerre.", "o": ["caused", "was cause", "made", "did"], "a": 0,"gs":"full"},{"id": "fv8", "f": "full", "y": 1, "t": "type", "q": "Tornadoes frequently ___ the Midwest.", "m": "Tornadoes frequently affect the Midwest.", "w": "« There are many tornadoes in the Midwest » n'a pas de vrai sujet. Tornadoes devient sujet, avec un vrai verbe d'action.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser THERE IS. Prendre un vrai sujet et un vrai verbe d'action : un vrai sujet + un vrai verbe (frequently affect, is prone to, is plagued by).", "hq": "Les tornades sont maintenant le sujet : que font-elles au Midwest ?", "nc": "There are many tornadoes in… (sans action) ≠ Tornadoes frequently ___ … (sujet + verbe).", "fr": "Les tornades frappent souvent le Midwest.", "a": ["affect", "hit", "strike", "ravage", "batter"], "h": "un vrai verbe d'action, pas there are","gs":"full"},{"id": "fv9", "f": "full", "y": 2, "t": "type", "q": "A major threat ___ from increasing regulatory pressure.", "m": "A major threat arises from increasing regulatory pressure.", "w": "« There is a major threat in… » est lourd. A threat arises from = une menace naît de.", "h2": "Business English L2 S4 — SWOT : a threat arises from… ; a weakness lies in… ; an opportunity exists in…", "hq": "Le sujet est a major threat. Quel verbe dit « naît de, vient de » avec from ?", "nc": "There is a major threat in (lourd) ≠ A major threat ___ from (précis).", "fr": "Une menace majeure naît de la pression réglementaire croissante.", "a": ["arises", "stems", "comes"], "h": "un verbe, pas there is","gs":"full"},{"id": "fv10", "f": "full", "y": 2, "t": "mc", "q": "A significant weakness ___ our limited distribution network.", "m": "A significant weakness lies in our limited distribution network.", "w": "is in est vide. lies in = réside dans, la tournure du SWOT.", "h2": "Business English L2 S4 — a weakness lies in… ; our core strength lies in…", "hq": "Quel verbe veut dire « réside dans » ?", "nc": "is in (vague) ≠ ___ in (réside dans).", "fr": "Une faiblesse importante réside dans notre réseau de distribution limité.", "o": ["lies in", "is in", "there is in", "stands in"], "a": 0,"gs":"full"},{"id": "fv11", "f": "full", "y": 1, "t": "mc", "q": "California ___ an economy larger than the United Kingdom's.", "m": "California boasts an economy larger than the United Kingdom's.", "w": "has est vide. boasts = peut se vanter de, se distingue par.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser HAVE. Utiliser un vrai verbe d'action, pour dire « se distinguer par » : boasts, enjoys, is characterized by.", "hq": "Quel verbe dit « se distingue par, peut s'enorgueillir de » ?", "nc": "has (posséder, vide) ≠ ___ (se distinguer par).", "fr": "La Californie peut s'enorgueillir d'une économie plus grande que celle du Royaume-Uni.", "o": ["boasts", "is having", "owns", "possesses of"], "a": 0,"gs":"full"},{"id": "fv12", "f": "full", "y": 1, "t": "order", "q": "", "m": "The open road symbolizes freedom and the frontier spirit.", "w": "« is a symbol of » est lourd. symbolizes (embodies, epitomizes) dit la relation en un verbe.", "h2": "Civilisation USA L1 S1 — is an example of → exemplifies, illustrates ; is a symbol of → symbolizes, embodies.", "hq": "Quel verbe remplace « is a symbol of » ?", "nc": "is a symbol of (lourd) ≠ ___ (vrai verbe d'action [verbe au sens précis, pas be, have, make, do]).", "fr": "La route ouverte symbolise la liberté et l'esprit de la Frontière.", "a": "The open road symbolizes freedom and the frontier spirit.","gs":"full"},{"id": "fv13", "f": "full", "y": 1, "t": "mc", "q": "Polk ___ territorial expansion toward the Southwest.", "m": "Polk pursued territorial expansion toward the Southwest.", "w": "« His goal was to get more land » est vide. pursued = poursuivre un objectif. persecuted = persécuter (faux ami [ressemble au français, sens différent]).", "h2": "Civilisation USA L1 S1 — Ne pas utiliser BE. Utiliser un vrai verbe d'action, pour dire « objectif » : pursued, sought, aimed to, strove to, set out to.", "hq": "« poursuivre un objectif » : quel verbe ? Attention au faux ami (ressemble au français, sens différent).", "nc": "___ a goal (poursuivre) ≠ persecute (persécuter).", "fr": "Polk a poursuivi l'expansion territoriale vers le Sud-Ouest.", "o": ["pursued", "followed", "persecuted", "chased after"], "a": 0,"gs":"full"},{"id": "fv14", "f": "full", "y": 1, "t": "mc", "q": "The United States ___ six time zones.", "m": "The United States spans six time zones.", "w": "has est vide. spans = s'étend sur.", "h2": "Civilisation USA L1 S1 — Ne pas utiliser HAVE. Utiliser un vrai verbe d'action : contenir, couvrir → spans, encompasses, contains.", "hq": "Quel verbe dit « s'étend sur » en un mot ?", "nc": "___ six time zones (s'étend sur) ≠ extends itself (calque [traduction mot à mot du français] de « s'étend »).", "fr": "Les États-Unis s'étendent sur six fuseaux horaires.", "o": ["spans", "has", "is in", "there are"], "a": 0,"gs":"full"},{"id": "sp1", "f": "tense", "y": 1, "t": "spot", "q": "I have been living in Nouméa since three years, and I still love it.", "a": [[6]], "m": "I have been living in Nouméa for three years, and I still love it.", "w": "Le temps est juste (have been living). L'erreur est sur le petit mot : three years est une durée → for.", "h2": "Grammaire L1 S1 — for + durée (for three years) ; since + point de départ (since 2023).", "hq": "Grammaire L1 S1 — Le verbe est bien conjugué. Regardez plutôt ce qui introduit three years : une durée ou un point de départ ?", "nc": "since 2023 (point de départ) ≠ ___ three years (durée).", "fr": "J'habite à Nouméa depuis trois ans, et j'adore toujours.","gs":"tense"},{"id": "sp2", "f": "tense", "y": 1, "t": "spot", "q": "It is the first time I visit Australia, so everything feels new.", "a": [[6]], "m": "It is the first time I have visited Australia, so everything feels new.", "w": "Après It is the first time, l'anglais exige le present perfect (have/has + participe passé : relie passé et présent) : I have visited (le français dit « je visite »).", "h2": "Grammaire L1 S1 — It's the first time + present perfect (have/has + participe passé : relie passé et présent) ; It was the first time + past perfect (had + participe passé : un passé avant un autre passé).", "hq": "Grammaire L1 S1 — Le français dit « c'est la première fois que je visite ». L'anglais garde-t-il ce présent après the first time ?", "nc": "C'est la première fois que je visite (présent) ≠ It's the first time I ___ (present perfect [have/has + participe passé : relie passé et présent]).", "fr": "C'est la première fois que je visite l'Australie, donc tout me paraît nouveau.","gs":"tense"},{"id": "sp3", "f": "tense", "y": 1, "t": "spot", "q": "He has worked for a bank in Sydney in 2019 before moving here.", "a": [[1]], "m": "He worked for a bank in Sydney in 2019 before moving here.", "w": "in 2019 est une date passée et finie : prétérit (passé anglais d'un fait terminé) worked, jamais has worked.", "h2": "Grammaire L1 S1 — Date finie (in 2019, last year, ago) → prétérit (passé anglais d'un fait terminé). Le present perfect (have/has + participe passé : relie passé et présent) refuse les dates.", "hq": "Grammaire L1 S1 — Repérez le marqueur (mot qui situe dans le temps : hier, depuis) de temps de la phrase. Est-il fini ou relié au présent ?", "nc": "He ___ there since 2019 (lien avec le présent) ≠ He ___ there in 2019 (date finie).", "fr": "Il a travaillé pour une banque à Sydney en 2019 avant de s'installer ici.","gs":"tense"},{"id": "sp4", "f": "agr", "y": 1, "t": "spot", "q": "The number of tourists visiting the island have doubled since 2019.", "a": [[7]], "m": "The number of tourists visiting the island has doubled since 2019.", "w": "Le sujet est The number (singulier), pas tourists : has doubled.", "h2": "Grammaire L1 S2 — The number of + pluriel → verbe au singulier ; A number of + pluriel → verbe au pluriel.", "hq": "Grammaire L1 S2 — Quel est le vrai sujet du verbe : le premier nom du groupe ou le dernier ?", "nc": "The number of tourists ___ (singulier) ≠ A number of tourists ___ (pluriel).", "fr": "Le nombre de touristes qui visitent l'île a doublé depuis 2019.","gs":"agr"},{"id": "sp5", "f": "agr", "y": 1, "t": "spot", "q": "Each of the new interns have received a welcome pack.", "a": [[5]], "m": "Each of the new interns has received a welcome pack.", "w": "Each = chacun, un par un : le verbe est au singulier (has), même devant of the interns.", "h2": "Grammaire L1 S2 — Each / every / either / neither + verbe au singulier.", "hq": "Grammaire L1 S2 — Le sujet est-il interns, ou le mot placé tout au début ?", "nc": "Each of them ___ (singulier) ≠ All of them ___ (pluriel).", "fr": "Chacun des nouveaux stagiaires a reçu un kit d'accueil.","gs":"agr"},{"id": "sp6", "f": "agr", "y": 2, "t": "spot", "q": "These figures shows a sharp increase in exports to Japan.", "a": [[2]], "m": "These figures show a sharp increase in exports to Japan.", "w": "These figures est pluriel : show, sans s. Le s de shows est réservé à he / she / it.", "h2": "Business English L2 S4 — This figure shows… / These figures show… — erreur pénalisée dans les copies.", "hq": "Business English L2 S4 — Le sujet est-il singulier ou pluriel ? Le verbe est-il d'accord ?", "nc": "This figure ___ (singulier) ≠ These figures ___ (pluriel).", "fr": "Ces chiffres montrent une forte hausse des exportations vers le Japon.","gs":"agr"},{"id": "sp7", "f": "count", "y": 1, "t": "spot", "q": "The manager gave us some very useful informations about the contract.", "a": [[7]], "m": "The manager gave us some very useful information about the contract.", "w": "information est indénombrable (qu'on ne compte pas : ni s, ni a/an) en anglais : jamais de s. Pour compter : a piece of information.", "h2": "Grammaire L1 S2 — Indénombrables (qu'on ne compte pas : ni s, ni a/an) : information, advice, equipment, furniture, news, research.", "hq": "Grammaire L1 S2 — Quel nom de la phrase ne se met jamais au pluriel en anglais, même si le français le permet ?", "nc": "des informations (français, pluriel) ≠ some ___ (anglais, sans s).", "fr": "Le responsable nous a donné des informations très utiles sur le contrat.","gs":"count"},{"id": "sp8", "f": "count", "y": 2, "t": "spot", "q": "Twenty-five thousands people attended the trade fair last weekend.", "a": [[1]], "m": "Twenty-five thousand people attended the trade fair last weekend.", "w": "Après un nombre, hundred / thousand / million restent invariables (ne changent jamais, pas de s) : twenty-five thousand.", "h2": "Pratique de la traduction L2 S4 — Les chiffres : two hundred, three thousand, five million (invariables [ne changent jamais, pas de s]). thousands of people = sans nombre devant.", "hq": "Pratique de la traduction L2 S4 — Regardez le mot qui suit Twenty-five : prend-il un s après un nombre précis ?", "nc": "___ of people (sans nombre) ≠ twenty-five ___ people (avec nombre).", "fr": "Vingt-cinq mille personnes ont assisté au salon le week-end dernier.","gs":"count"},{"id": "sp9", "f": "verb", "y": 1, "t": "spot", "q": "We discussed about the new pricing strategy during the meeting.", "a": [[2]], "m": "We discussed the new pricing strategy during the meeting.", "w": "discuss se construit directement, sans préposition (petit mot devant un nom : à, de, pour) : discuss something.", "h2": "Grammaire L1 S2 — Verbes sans préposition (petit mot devant un nom : à, de, pour) : discuss, enter, reach, attend, answer, lack.", "hq": "Grammaire L1 S2 — Le français dit « discuter de ». L'anglais a-t-il besoin d'un petit mot entre le verbe et son complément (ce qui complète le verbe ou le nom) ?", "nc": "a discussion ___ the strategy (nom + préposition [petit mot devant un nom : à, de, pour]) ≠ discuss ___ the strategy (verbe direct).", "fr": "Nous avons parlé de la nouvelle stratégie de prix pendant la réunion.","gs":"verb"},{"id": "sp10", "f": "verb", "y": 1, "t": "spot", "q": "She explained me why the shipment had been delayed.", "a": [[2]], "m": "She explained to me why the shipment had been delayed.", "w": "explain n'a pas de complément (ce qui complète le verbe ou le nom) de personne direct : explain something to someone.", "h2": "Grammaire L1 S2 — explain / describe / suggest + to + personne (jamais explain me).", "hq": "Grammaire L1 S2 — Le français dit « elle m'a expliqué ». Comment l'anglais introduit-il la personne après explain ?", "nc": "She told ___ why (tell + personne) ≠ She explained ___ ___ why (explain + to).", "fr": "Elle m'a expliqué pourquoi la livraison avait été retardée.","gs":"verb"},{"id": "sp11", "f": "verb", "y": 1, "t": "spot", "q": "I look forward to meet you at the conference next week.", "a": [[4]], "m": "I look forward to meeting you at the conference next week.", "w": "Dans look forward to, to est une préposition (petit mot devant un nom : à, de, pour) : elle est suivie de -ing.", "h2": "Grammaire L1 S2 — to préposition (petit mot devant un nom : à, de, pour) + V-ing (verbe + -ing : working) : look forward to, be used to, object to, when it comes to.", "hq": "Grammaire L1 S2 — Dans cette expression, to annonce-t-il un infinitif (le verbe précédé de to) ou est-ce une préposition (petit mot devant un nom : à, de, pour) ?", "nc": "I want to ___ you (to + base verbale [le verbe tout nu, sans to ni s]) ≠ I look forward to ___ you (to + -ing).", "fr": "J'ai hâte de vous rencontrer à la conférence la semaine prochaine.","gs":"verb"},{"id": "sp12", "f": "verb", "y": 2, "t": "spot", "q": "After six months in Sydney, I am used to work under pressure.", "a": [[9]], "m": "After six months in Sydney, I am used to working under pressure.", "w": "be used to = avoir l'habitude de : to est une préposition (petit mot devant un nom : à, de, pour), donc working.", "h2": "Grammaire L1 S2 — be / get used to + V-ing (habitude) ≠ used to + base verbale (habitude passée révolue).", "hq": "Grammaire L1 S2 — Cette phrase parle-t-elle d'une habitude passée révolue ou d'une habitude actuelle ? Que suit to ?", "nc": "I used to ___ (autrefois) ≠ I am used to ___ (j'ai l'habitude).", "fr": "Après six mois à Sydney, j'ai l'habitude de travailler sous pression.","gs":"verb"},{"id": "sp13", "f": "verb", "y": 2, "t": "spot", "q": "He suggested me to contact the supplier directly.", "a": [[2, 3]], "m": "He suggested that I contact the supplier directly.", "w": "suggest n'accepte pas « quelqu'un + to » : suggest that I contact, ou suggest contacting.", "h2": "Grammaire L1 S2 — suggest + that + sujet + base verbale (le verbe tout nu, sans to ni s), ou suggest + V-ing (verbe + -ing : working). Jamais suggest somebody to.", "hq": "Grammaire L1 S2 — advise accepte « quelqu'un + verbe » (« il m'a conseillé de… »). suggest accepte-t-il la même construction ?", "nc": "He advised me ___ contact (advise + personne + to) ≠ He suggested ___ I contact.", "fr": "Il m'a suggéré de contacter directement le fournisseur.","gs":"verb"},{"id": "sp14", "f": "prep", "y": 1, "t": "spot", "q": "Despite of the crisis, the company increased its profits.", "a": [[1]], "m": "Despite the crisis, the company increased its profits.", "w": "despite ne prend jamais of. On dit despite the crisis, ou in spite of the crisis.", "h2": "Pratique de la traduction L2 S4 — despite + nom ; in spite of + nom. Pas de mélange des deux.", "hq": "Pratique de la traduction L2 S4 — Le français dit « en dépit de ». L'anglais despite a-t-il besoin du de ?", "nc": "in spite ___ the crisis ≠ despite ___ the crisis (rien).", "fr": "Malgré la crise, l'entreprise a augmenté ses bénéfices.","gs":"prep"},{"id": "sp15", "f": "prep", "y": 1, "t": "spot", "q": "The company depends of a single Australian distributor.", "a": [[3]], "m": "The company depends on a single Australian distributor.", "w": "depend se construit avec on : depend on, dependent on.", "h2": "Business English L2 S4 — depend on, rely on, focus on, insist on.", "hq": "Business English L2 S4 — Le français dit « dépendre de ». Quelle préposition (petit mot devant un nom : à, de, pour) l'anglais utilise-t-il ?", "nc": "dépendre de (français) ≠ depend ___ (anglais).", "fr": "L'entreprise dépend d'un seul distributeur australien.","gs":"prep"},{"id": "sp16", "f": "prep", "y": 2, "t": "spot", "q": "Sales rose of 15% last year thanks to the new website.", "a": [[2]], "m": "Sales rose by 15% last year thanks to the new website.", "w": "L'écart d'une hausse se dit avec by : rose by 15%. to donne le niveau d'arrivée.", "h2": "Pratique de la traduction L2 S4 — rise by 15% (écart) ; rise to 50 dollars (niveau atteint) ; from… to…", "hq": "Pratique de la traduction L2 S4 — Le français dit « augmenter de 15 % ». Quelle préposition (petit mot devant un nom : à, de, pour) donne l'écart en anglais ?", "nc": "rose ___ 50 dollars (niveau atteint) ≠ rose ___ 15% (écart).", "fr": "Les ventes ont augmenté de 15 % l'an dernier grâce au nouveau site.","gs":"prep"},{"id": "sp17", "f": "conf", "y": 1, "t": "spot", "q": "She is responsible of the export department since January.", "a": [[1], [3]], "m": "She has been responsible for the export department since January.", "w": "Deux pièges : responsible for (pas of), et since impose le present perfect (have/has + participe passé : relie passé et présent) : has been.", "h2": "Grammaire L1 S2 — responsible for ; since + present perfect (have/has + participe passé : relie passé et présent).", "hq": "Grammaire L1 S2 — Deux mots clochent. Regardez la préposition (petit mot devant un nom : à, de, pour) après l'adjectif (mot qui décrit un nom : grand, utile), puis le temps avec since.", "nc": "responsable de (français) ≠ responsible ___ (anglais).", "fr": "Elle est responsable du service export depuis janvier.","gs":"conf"},{"id": "sp18", "f": "conf", "y": 2, "t": "spot", "q": "Our society employs two hundred people in Nouméa.", "a": [[1]], "m": "Our company employs two hundred people in Nouméa.", "w": "society = la société au sens « les gens, la communauté ». Une entreprise = a company, a firm.", "h2": "Civilisation USA L1 S1 — Faux amis (ressemblent au français, sens différent) : society ≠ entreprise ; enormity ≠ immensité ; actually ≠ actuellement.", "hq": "Civilisation USA L1 S1 — Un mot de la phrase est un faux ami (ressemble au français, sens différent) : lequel désigne en anglais la communauté humaine, pas une entreprise ?", "nc": "la société (entreprise) ≠ ___ (les gens).", "fr": "Notre société emploie deux cents personnes à Nouméa.","gs":"conf"},{"id": "sp19", "f": "conf", "y": 2, "t": "spot", "q": "We have to assist the board meeting on Monday morning.", "a": [[3]], "m": "We have to attend the board meeting on Monday morning.", "w": "assist = aider. Être présent à une réunion = attend a meeting.", "h2": "Business English L2 S4 — attend a meeting (être présent) ≠ assist someone (aider).", "hq": "Business English L2 S4 — Un verbe est un faux ami (ressemble au français, sens différent) : veut-il dire « être présent » ou « aider » ?", "nc": "assister à (être présent) ≠ ___ (aider).", "fr": "Nous devons assister au conseil d'administration lundi matin.","gs":"conf"},{"id": "sp20", "f": "full", "y": 1, "t": "spot", "q": "The United States extends itself over six time zones.", "a": [[4]], "m": "The United States extends over six time zones.", "w": "Le français dit « s'étend ». L'anglais extends n'est pas pronominal (verbe avec « se » : s'étendre) : pas de itself. Mieux encore : spans.", "h2": "Civilisation USA L1 S1 — Calques (traductions mot à mot du français) à éviter : extends itself, finished by, augmented the territory.", "hq": "Civilisation USA L1 S1 — Le français a un verbe pronominal (« s'étend »). L'anglais garde-t-il le pronom ?", "nc": "s'étendre (pronominal [verbe avec « se » : s'étendre]) ≠ extend / span (sans pronom).", "fr": "Les États-Unis s'étendent sur six fuseaux horaires.","gs":"full"},{"id": "sp21", "f": "full", "y": 1, "t": "spot", "q": "Polk augmented the territory of the United States by a third.", "a": [[1]], "m": "Polk expanded the territory of the United States by a third.", "w": "augmented est un calque (traduction mot à mot du français) de « augmenter ». Pour un territoire : expand, enlarge.", "h2": "Civilisation USA L1 S1 — Calques (traductions mot à mot du français) : augmented the territory → expanded ; obliged → forced ; resolved a dispute → settled.", "hq": "Civilisation USA L1 S1 — Quel verbe est un calque (traduction mot à mot du français) du français ? Pour un territoire, que dit l'anglais ?", "nc": "augmenter (français) ≠ ___ a territory (anglais).", "fr": "Polk a agrandi le territoire des États-Unis d'un tiers.","gs":"full"},{"id": "sp22", "f": "noun", "y": 1, "t": "spot", "q": "A ten-years-old girl won the national spelling contest.", "a": [[1]], "m": "A ten-year-old girl won the national spelling contest.", "w": "Dans un adjectif composé (mots reliés par des tirets devant un nom) avant le nom, le nom reste au singulier : a ten-year-old girl.", "h2": "Grammaire L1 S2 — Nom composé (deux noms collés : le premier décrit le second) adjectif (mot qui décrit un nom : grand, utile) : a ten-year-old girl, a two-hour meeting, a five-star hotel.", "hq": "Grammaire L1 S2 — Dans le groupe placé devant girl, un mot porte un s qu'il ne devrait pas avoir.", "nc": "She is ten ___ old (attribut [ce qui suit be pour décrire le sujet], pluriel) ≠ a ten-___-old girl (devant le nom, singulier).", "fr": "Une fillette de dix ans a gagné le concours national d'orthographe.","gs":"noun"},{"id": "sp23", "f": "tense", "y": 2, "t": "spot", "q": "If the company would lower its prices, sales would rise.", "a": [[3]], "m": "If the company lowered its prices, sales would rise.", "w": "Dans la subordonnée (partie de phrase qui dépend d'une autre : if…, when…) en if, pas de would : prétérit (lowered). would va dans la principale (partie de phrase qui tient seule).", "h2": "Grammaire L1 S2 — If + prétérit (passé anglais d'un fait terminé), would + base verbale (le verbe tout nu, sans to ni s).", "hq": "Grammaire L1 S2 — Dans une phrase en if, quel temps prend le verbe de la proposition (morceau de phrase avec son propre verbe) qui commence par if ?", "nc": "If it ___ its prices (prétérit [passé anglais d'un fait terminé]) ≠ sales ___ rise (would).", "fr": "Si l'entreprise baissait ses prix, les ventes augmenteraient.","gs":"tense"}];

/* listening passages */
const LP=[{"id": "p1", "title": "US Europe Satellite Mission", "src": "Listening B2", "y": 1, "text": "A satellite jointly developed by Europe and the United States being launched this weekend will greatly help scientists keep track of the rise in global sea levels, one of the most daunting effects of climate change. The new satellite, called Sentinel-6 Michael Freilich, contains cutting-edge instruments able to capture sea level height with unprecedented accuracy, adding to space-based measurements going back almost 30 years. Billions of people living in coastal areas around the planet are at risk in the coming decades as melting polar ice and ocean expansion caused by warming water drives sea levels up. The speed of the rising has increased since the 1990s, at first by about three millimeters per year but by almost five millimeters in the past couple of years. While sea level measurements are also taken at ground level, in harbors and other coastal areas, they don’t provide the same precise uniform standard and breadth as data collected by a single satellite sweeping the entire globe every ten days.", "qs": [{"q": "What will the new satellite help scientists keep track of?", "o": ["the rise in sea levels", "the speed of currents", "the temperature of the air", "the number of storms"], "a": 0, "w": "Le texte dit : le satellite aidera à suivre « the rise in global sea levels »."}, {"q": "How long have sea levels been measured from space?", "o": ["almost 30 years", "about ten years", "almost 50 years", "only a few months"], "a": 0, "w": "« space-based measurements going back almost 30 years » : depuis près de 30 ans."}, {"q": "How often does the satellite sweep the entire globe?", "o": ["every ten days", "every day", "every month", "every thirty days"], "a": 0, "w": "« a single satellite sweeping the entire globe every ten days »."}], "bonus": "Billions of people living in coastal areas around the planet are at risk in the coming decades.", "bonusFr": "Des milliards de personnes vivant dans des zones côtières à travers la planète sont menacées dans les décennies à venir.", "ex": ["A satellite jointly developed by Europe and the United States being launched this weekend will greatly help scientists keep track of the rise in global sea levels", "adding to space-based measurements going back almost 30 years", "data collected by a single satellite sweeping the entire globe every ten days"], "vocab": [["keep track of", "suivre, surveiller l'évolution de"], ["the rise in global sea levels", "la montée du niveau des mers"], ["daunting", "redoutable, décourageant"], ["cutting-edge", "de pointe"], ["unprecedented accuracy", "une précision sans précédent"], ["coastal areas", "les zones côtières"], ["at risk", "menacé(e)s, en danger"], ["melting polar ice", "la fonte des glaces polaires"]], "learn": [["The satellite will help scientists keep track of the rise in sea levels.", "Le satellite aidera les scientifiques à suivre la montée du niveau des mers."], ["Billions of people living in coastal areas are at risk.", "Des milliards de personnes vivant dans des zones côtières sont menacées."], ["Sea levels have been rising faster since the 1990s.", "Le niveau des mers monte plus vite depuis les années 1990."]], "gram": "keep track of + nom (suivre) ; since + date avec HAVE-EN : has increased since the 1990s."}, {"id": "p2", "title": "Have female CEOs coped better with Covid than men?", "src": "Listening B2", "y": 2, "text": "Have female world leaders been more effective in tackling the coronavirus pandemic than their male counterparts? From New Zealand's Prime Minister Jacinda Ardern, to Taiwan's President Tsai Ing-wen and German Chancellor Angela Merkel, it is a widely-held view. Journalists decided to interview five female business leaders about Covid and discuss their views on whether there is a female-style of leadership. One journalist concludes that Anglo-Saxon countries strike me as having a high expectation of masculinity, so with leaders... combative, individualistic and cut slightly macho. Female leadership is different in style and tone. He said: I think that female leaders tend to wear their heart on their sleeves a lot more than their male counterparts. You show people the reality of the world you're living in, and they can empathise with you and they support you more. There's just still a presumption that women are less entitled to lead than men. However, some female business leaders are hopeful that the pandemic will lead to a lasting change. \"Never before have we appreciated feminine leadership in the workplace as we now do, and that's here to stay,\" adds one journalist.", "qs": [{"q": "Who did the journalists interview?", "o": ["five female business leaders", "five male prime ministers", "three female presidents", "five female scientists"], "a": 0, "w": "« interview five female business leaders » : cinq dirigeantes d'entreprise."}, {"q": "How is masculine leadership described in Anglo-Saxon countries?", "o": ["combative and individualistic", "cooperative and empathetic", "emotional and transparent", "cautious and collective"], "a": 0, "w": "Le journaliste parle de dirigeants « combative, individualistic and cut slightly macho »."}, {"q": "According to the article, what do female leaders tend to do?", "o": ["show their feelings more openly", "hide the reality of the crisis", "copy the male leaders' style", "avoid talking to the press"], "a": 0, "w": "« wear their heart on their sleeves » = montrer ses sentiments ouvertement."}], "bonus": "Female leadership is different in style and tone.", "bonusFr": "Le leadership féminin est différent par le style et par le ton.", "ex": ["Journalists decided to interview five female business leaders about Covid", "combative, individualistic and cut slightly macho", "female leaders tend to wear their heart on their sleeves a lot more than their male counterparts"], "vocab": [["tackling", "s'attaquer à, gérer (tackle)"], ["counterparts", "les homologues"], ["a widely-held view", "une opinion largement répandue"], ["business leaders", "des dirigeants d'entreprise"], ["wear their heart on their sleeves", "montrer ouvertement ses sentiments"], ["empathise with", "comprendre, se mettre à la place de"], ["a lasting change", "un changement durable"], ["here to stay", "fait pour durer"]], "learn": [["Female leaders tend to wear their heart on their sleeves.", "Les dirigeantes ont tendance à montrer davantage leurs sentiments."], ["The pandemic will lead to a lasting change.", "La pandémie entraînera un changement durable."], ["Never before have we appreciated feminine leadership as we now do.", "Jamais on n'a autant apprécié le leadership féminin qu'aujourd'hui."]], "gram": "Never before have we… : après une négation en tête de phrase, l'auxiliaire passe devant le sujet (inversion)."}, {"id": "p3", "title": "Is teleworking driving us crazy?", "src": "Listening B3", "y": 2, "text": "There are strong arguments in favour of teleworking: Time saved, not having to drive to a central office, better quality of life, and more flexibility for employees to organise their time. High-speed internet and private networks now make teleworking feasible without damaging corporate security. Most importantly, workers seem to like it. In August 2012, UK mobile phone operator Vodafone said most workers in London now wanted to work more flexibly after trying it during the London Olympics. Of people surveyed, 24% said they had changed their normal working arrangements over the period, either working from home or another location, to avoid the expected travel restrictions. Productivity had increased as a result, they said, principally because of the time saved not having to drive to work. And research by Mitel, published in July, indicated 81% of UK workers, and 87% of younger employees, wanted to escape the nine-to-five culture.", "qs": [{"q": "Why did many London workers try teleworking in 2012?", "o": ["the Olympic Games", "a long transport strike", "a new company law", "a summer heatwave"], "a": 0, "w": "Ils ont essayé le télétravail « during the London Olympics »."}, {"q": "What percentage of people changed their working arrangements?", "o": ["24%", "81%", "87%", "42%"], "a": 0, "w": "24 %. Les chiffres 81 % et 87 % concernent ceux qui veulent échapper au « nine-to-five »."}, {"q": "Why did productivity increase?", "o": ["people saved time on travel", "people worked longer hours", "offices were quieter", "managers checked work more"], "a": 0, "w": "« because of the time saved not having to drive to work »."}], "bonus": "Most workers in London now wanted to work more flexibly after trying it during the London Olympics.", "bonusFr": "La plupart des salariés londoniens voulaient désormais travailler de façon plus flexible après l'avoir essayé pendant les Jeux olympiques de Londres.", "ex": ["most workers in London now wanted to work more flexibly after trying it during the London Olympics", "Of people surveyed, 24% said they had changed their normal working arrangements over the period", "principally because of the time saved not having to drive to work"], "vocab": [["teleworking", "le télétravail"], ["in favour of", "en faveur de"], ["flexibility", "la souplesse, la flexibilité"], ["feasible", "réalisable, faisable"], ["people surveyed", "les personnes interrogées"], ["working arrangements", "l'organisation du travail"], ["Productivity", "la productivité"], ["the nine-to-five culture", "les horaires de bureau fixes (9 h-17 h)"]], "learn": [["Teleworking saves time and gives employees more flexibility.", "Le télétravail fait gagner du temps et donne plus de souplesse aux salariés."], ["Productivity had increased because people no longer had to drive to work.", "La productivité avait augmenté parce que les gens n'avaient plus à prendre la voiture pour aller travailler."], ["Most workers want to escape the nine-to-five culture.", "La plupart des salariés veulent échapper aux horaires de bureau fixes."]], "gram": "had increased : HAVE-EN au passé, pour un fait antérieur à un autre fait passé."}, {"id": "p4", "title": "Young Adults in the U.S.", "src": "Listening B3", "y": 2, "text": "Most young adults now live with their parents. The number of 18- to 30-year-olds living at home has hit an 80-year high. Around 52 per cent are at home with one or both parents. Only in the Great Depression of the 1930s was the percentage higher. The recent rise in the number of young adults moving back in with their parents is due to the economic downturn and a rise in unemployment caused by coronavirus. An analyst said adults were living with parents because of loan debts and a lack of jobs. This has been exacerbated by the pandemic. He said: \"It may take...the major part of a decade for [this] to recover and be financially stable enough to leave home.\" He concluded: \"For the most part, nobody wants to be living at home with mom and dad.\" Another analyst said young people not moving into cities could affect the property rental market.", "qs": [{"q": "What share of 18- to 30-year-olds live at home with a parent?", "o": ["about 52%", "about 25%", "about 80%", "about 30%"], "a": 0, "w": "« Around 52 per cent are at home ». 80 renvoie à « an 80-year high », 30 à l'âge."}, {"q": "When was this percentage higher?", "o": ["in the 1930s", "in the 1940s", "in the 1980s", "never before"], "a": 0, "w": "« Only in the Great Depression of the 1930s was the percentage higher »."}, {"q": "Which two reasons does the analyst give?", "o": ["loan debts and a lack of jobs", "high rents and long studies", "family traditions and marriage", "the cost of cars and petrol"], "a": 0, "w": "« because of loan debts and a lack of jobs »."}], "bonus": "For the most part, nobody wants to be living at home with mom and dad.", "bonusFr": "Dans l'ensemble, personne n'a envie de vivre chez papa et maman.", "ex": ["Around 52 per cent are at home with one or both parents.", "Only in the Great Depression of the 1930s was the percentage higher.", "adults were living with parents because of loan debts and a lack of jobs"], "vocab": [["young adults", "les jeunes adultes"], ["has hit an 80-year high", "a atteint son plus haut niveau depuis 80 ans"], ["the economic downturn", "le ralentissement économique"], ["unemployment", "le chômage"], ["loan debts", "les dettes d'emprunt"], ["a lack of jobs", "un manque d'emplois"], ["financially stable", "financièrement stable"], ["the property rental market", "le marché de la location immobilière"]], "learn": [["Only in the 1930s was the percentage higher.", "Ce n'est que dans les années 1930 que le pourcentage était plus élevé."], ["The rise is due to the economic downturn.", "Cette hausse est due au ralentissement économique."], ["Nobody wants to be living at home with mom and dad.", "Personne n'a envie de vivre chez papa et maman."]], "gram": "Only in the 1930s was the percentage higher : après Only en tête de phrase, l'auxiliaire passe devant le sujet."}, {"id": "p5", "title": "We are as smart as Rocket Scientists", "src": "Listening B3", "y": 2, "text": "We think that rocket scientists and brain surgeons are super-brainy. New research suggests ordinary people are just as smart. Researchers tested 329 aerospace engineers and 72 neurosurgeons on six areas of cognition. They compared their data with those from 18,257 \"normal\" people. The researchers said: \"Only two differences were significant: the neurosurgeons' problem-solving speed was quicker and their memory recall speed was slower.\" The research questions the use of phrases such as \"this isn't rocket science\" or \"that isn't brain surgery\". These suggest something is actually quite easy to understand. The researchers said when we require rapid problem solving, \"it might be more correct to use 'It's not brain surgery', but in situations where rapid information recall is needed this phrase should be avoided\". This gives hope to all of us who want exciting careers with \"genius-level\" requirements. However, this could lead to an excess of brain surgeons and rocket designers.", "qs": [{"q": "What does the new research suggest?", "o": ["ordinary people are just as smart", "rocket scientists are much smarter", "brain surgeons remember faster", "nobody can be called a genius"], "a": 0, "w": "« New research suggests ordinary people are just as smart »."}, {"q": "How many 'normal' people were in the comparison group?", "o": ["18,257", "32,900", "7,200", "1,825"], "a": 0, "w": "18 257 personnes « normales », comparées à 329 ingénieurs et 72 neurochirurgiens."}, {"q": "What was quicker for the neurosurgeons?", "o": ["their problem-solving", "their memory recall", "their reading speed", "their calculations"], "a": 0, "w": "« the neurosurgeons' problem-solving speed was quicker and their memory recall speed was slower »."}], "bonus": "These phrases suggest something is actually quite easy to understand.", "bonusFr": "Ces expressions laissent entendre que quelque chose est en réalité assez facile à comprendre.", "ex": ["New research suggests ordinary people are just as smart.", "They compared their data with those from 18,257 \"normal\" people.", "the neurosurgeons' problem-solving speed was quicker and their memory recall speed was slower"], "vocab": [["brain surgeons", "les neurochirurgiens"], ["ordinary people", "les gens ordinaires"], ["just as smart", "tout aussi intelligents"], ["problem-solving", "la résolution de problèmes"], ["memory recall", "la mémoire (capacité à se souvenir)"], ["this isn't rocket science", "ce n'est pas sorcier"], ["requirements", "les exigences"], ["an excess of", "un excès de"]], "learn": [["Ordinary people are just as smart as rocket scientists.", "Les gens ordinaires sont tout aussi intelligents que les ingénieurs en aérospatiale."], ["This isn't rocket science.", "Ce n'est pas sorcier."], ["This could lead to an excess of brain surgeons.", "Cela pourrait conduire à un excès de neurochirurgiens."]], "gram": "just as smart as : comparatif d'égalité as … as (aussi … que)."}, {"id": "p6", "title": "A shortage in Maple Syrup", "src": "Listening B3", "y": 2, "text": "Changing weather patterns and an increase in demand have led to shortages of maple syrup. Stocks of this popular pancake topping have gone down. Luckily, Canada keeps huge amounts of it for emergencies. A maple syrup spokeswoman said there would be no shortages. Canada is the world's largest maple syrup producer. It produces around three-quarters of the global maple syrup supply. A warmer spring reduced syrup supplies. Maple trees need warm daytime and freezing nighttime temperatures. The warmer, shorter spring led to a poorer harvest. Another factor is worldwide demand. This increased by more than 20 per cent this year. One major reason for this is the pandemic. More people are at home, cooking pancakes and waffles. The maple syrup spokeswoman said: \"The pandemic helped our case because we're seeing people cook more at home and use more local products. It's not just in [Canada] where the demand is increasing.\"", "qs": [{"q": "Why is the shortage not a real problem for consumers?", "o": ["Canada keeps huge reserves", "prices have gone down", "other countries produce more", "demand is falling"], "a": 0, "w": "« Canada keeps huge amounts of it for emergencies »."}, {"q": "How much of the world's maple syrup does Canada produce?", "o": ["about three-quarters", "about one-half", "about one-quarter", "nearly nine-tenths"], "a": 0, "w": "« around three-quarters of the global maple syrup supply »."}, {"q": "Why has world demand increased?", "o": ["people cook more at home", "prices have fallen", "there are more trees", "restaurants use more syrup"], "a": 0, "w": "Avec la pandémie, « more people are at home, cooking pancakes and waffles »."}], "bonus": "A warmer, shorter spring led to a poorer harvest.", "bonusFr": "Un printemps plus chaud et plus court a donné une récolte plus maigre.", "ex": ["Luckily, Canada keeps huge amounts of it for emergencies.", "It produces around three-quarters of the global maple syrup supply.", "More people are at home, cooking pancakes and waffles."], "vocab": [["Changing weather patterns", "l'évolution des conditions météo"], ["an increase in demand", "une hausse de la demande"], ["shortages", "des pénuries"], ["Stocks", "les stocks, les réserves"], ["emergencies", "les situations d'urgence"], ["spokeswoman", "une porte-parole"], ["a poorer harvest", "une récolte plus maigre"], ["worldwide demand", "la demande mondiale"]], "learn": [["Changing weather patterns have led to shortages.", "L'évolution des conditions météo a entraîné des pénuries."], ["Canada keeps huge amounts of syrup for emergencies.", "Le Canada garde d'énormes quantités de sirop pour les situations d'urgence."], ["Worldwide demand increased by more than 20 per cent.", "La demande mondiale a augmenté de plus de 20 %."]], "gram": "lead, led, led : have led to (ont entraîné) ; an increase in demand (in, et non of)."}, {"id": "p7", "title": "Squid Game craziness", "src": "Listening B3", "y": 2, "text": "People are trying to buy clothes worn in the very popular South Korean TV series \"Squid Game\". Many people want the green tracksuits and pink jumpsuits from the show to wear as Halloween costumes. Clothes factories in Korea are trying to make enough clothes to meet demand. One factory owner said: \"October is usually a slow month for the sewing industry, but thanks to Squid Game and Halloween, we are scrambling to sew enough clothes.\" Squid Game is another example of South Korean culture becoming popular worldwide. Netflix broadcast it on September 17. It is now Netflix's most watched series ever. Around 142 million people watched Squid Game in the 28 days after its release. The series is a survival contest between 456 players who are in debt. They play children's games to try to win $40 million to get out of debt. However, the games could kill them.", "qs": [{"q": "Why do people want the g ": "p8", "title": "Coldest temperature on Earth recorded", "src": "Listening", "y": 1, "text": "Scientists recently found the coldest place on Earth. Satellites measured a temperature of minus 93.2 degrees Celsius on part of Antarctica. Scientists still need to do more tests on the data. The coldest temperature found before this was also in Antarctica. This was minus 89.2 degrees Celsius. Scientist Dr Ted Scambos said: \"These very low temperatures are hard to imagine.\" He added that parts of Antarctica are 50 degrees colder than Siberia. Nowhere on Antarctica is as cold as the Moon. Temperatures there got as low as minus 238 degrees Celsius. Dr Scambos said he is sure that the temperatures recorded by the satellites are accurate. He also said that they would be too cold for a thermometer to work properly. He said it was so cold that you cannot breathe the air. When scientists go outside, they must breathe the warmer air that is close to their skin.", "qs": [{"q": "What temperature did the satellites measure?", "o": ["minus 93.2 °C", "minus 89.2 °C", "minus 238 °C", "minus 50 °C"], "a": 0, "w": "−93,2 °C. −89,2 °C était l'ancien record, −238 °C la Lune."}, {"q": "Where was the previous record?", "o": ["also in Antarctica", "in eastern Siberia", "on the Moon's surface", "in northern Greenland"], "a": 0, "w": "« The coldest temperature found before this was also in Antarctica »."}, {"q": "What do scientists breathe when they go outside?", "o": ["the warmer air near their skin", "air from oxygen bottles", "air heated by a machine", "the air inside their tents"], "a": 0, "w": "« they must breathe the warmer air that is close to their skin »."}], "bonus": "These very low temperatures are hard to imagine.", "bonusFr": "Ces températures très basses sont difficiles à imaginer.", "ex": ["Satellites measured a temperature of minus 93.2 degrees Celsius on part of Antarctica.", "The coldest temperature found before this was also in Antarctica.", "they must breathe the warmer a const KEY="lea-english-lab-v1";
let S={year:1,fam:{},item:{},round:0};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let R=null; /* current round */
S.listen=S.listen||{};S.bonus=S.bonus||{done:0};
let SAMPLE=null,TTS=null;
try{window.claude&&window.claude.use&&window.claude.use("sample").then(s=>{SAMPLE=s}).catch(()=>{})}catch(e){}
try{window.claude&&window.claude.use&&window.claude.use("tts").then(t=>{TTS=t}).catch(()=>{})}catch(e){}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").replace(/[.!?]$/,"").trim();
const shuf=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const stage=document.getElementById("stage");

function mastery(f){const s=S.fam[f]||{seen:0,ok:0};return {seen:s.seen,pct:Math.round(100*(s.ok+1)/(s.seen+2))}}

function pick(){
 const pool=I.filter(x=>x.y<=S.year);
 const due=pool.filter(x=>{const s=S.item[x.id];return s&&!s.last&&S.round-s.when>=1});
 const chosen=shuf(due).slice(0,3);
 const w=f=>{const m=mastery(f);return 0.6+3*(1-m.pct/100)};
 const rest=pool.filter(x=>!chosen.includes(x)&&!(S.item[x.id]&&S.item[x.id].last&&S.round-S.item[x.id].when<3));
 let cand=rest.length>=10?rest:pool.filter(x=>!chosen.includes(x));
 while(chosen.length<10&&cand.length){
  const tot=cand.reduce((s,x)=>s+w(x.f),0);let r=Math.random()*tot,k=0;
  for(;k<cand.length;k++){r-=w(cand[k].f);if(r<=0)break}
  const it=cand[Math.min(k,cand.length-1)];chosen.push(it);cand=cand.filter(x=>x!==it&&!(x.f===it.f&&chosen.filter(c=>c.f===it.f).length>=3));
 }
 return shuf(chosen);
}

 <div class="act"><button class="btn" id="go" type="button">Travailler l'écrit</button><button class="btn" id="listen" type="button">Travailler l'oral</button></div>

 stage.querySelectorAll(".yr").forEach(b=>b.onclick=()=>{S.year=+b.dataset.y;save();home()});

function start(){R={items:pick(),i:0,score:0,miss:[]};go(roundView)}
function roundView(){if(!R)return home();if(R.i>=R.items.length)return end(true);show()}
function practice(it){R={items:[it],i:0,score:0,miss:[],single:true};go(roundView)}

function show(){
 const it=R.items[R.i];
 const head=`<div class="prog" aria-hidden="true"><i style="width:${R.i*10}%"></i></div>`;
 const kind={mc:"Choose the right answer",type:"Type the missing word",drag:"Drag (or tap) the words into the gaps",order:"Build the sentence: tap or drag the words in order",spot:it.a&&it.a.length>1?`Tap the ${it.a.length} mistakes`:"Tap the mistake"}[it.t];
 let body="";
 const gaps=s=>{let n=0;return esc(s).replace(/___/g,()=>`<span class="gap" data-g="${n++}" tabindex="0" role="button" aria-label="gap ${n}">&nbsp;</span>`)};
 if(it.t==="mc")body=`<p class="q">${esc(it.q).replace("___",'<span class="gap" aria-hidden="true">&nbsp;</span>')}</p><div class="opts">${shuf(it.o.map((o,k)=>[o,k])).map(([o,k])=>`<button type="button" class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>${it.o.includes("Ø")?'<p class="hint">Ø = no word at all.</p>':""}`;
 if(it.t==="type")body=`<p class="q">${esc(it.q).replace("___",'<span class="gap" aria-hidden="true">&nbsp;</span>')}</p><label class="small" for="ans">Your word (${esc(it.h)})</label><br><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false">`;
 if(it.t==="drag")body=`<p class="q">${gaps(it.q)}</p><div class="bank" id="bank">${shuf(it.b).map((w,k)=>`<button type="button" class="tile" draggable="true" data-w="${esc(w)}" data-t="${k}">${esc(w)}</button>`).join("")}</div>${it.b.includes("Ø")?'<p class="hint">Ø = no word at all.</p>':""}`;
 if(it.t==="order"){const ws=it.a.split(" ");body=`<div class="line" id="line" aria-label="Your sentence"></div><div class="bank" id="bank">${shuf(ws.map((w,k)=>[w,k])).map(([w,k])=>`<button type="button" class="tile" draggable="true" data-w="${esc(w)}" data-t="${k}">${esc(w)}</button>`).join("")}</div>`}
 if(it.t==="spot")body=`<p class="q spotq"><span class="sx">✗</span> ${it.q.split(" ").map((w,k)=>`<button type="button" class="wd" data-k="${k}">${esc(w)}</button>`).join(" ")}</p>`;
 stage.innerHTML=head+`<div class="card"><div class="cardhead"><b>${R.single?"Exercise":`Exercise ${R.i+1} of 10`}</b><span>${it.relance?"Same trap, new sentence · ":""}${esc(FAM[it.f].n)}</span></div><div class="cardbody">
 <p class="small">${kind}${it.src?` · source : ${esc(it.src)}`:""}</p>${body}
 <div class="act"><button class="btn" id="check" type="button">Check</button><button class="btn ghost" id="hint" type="button">Hint</button><button class="btn ghost" id="conf" type="button">≠ À ne pas confondre</button><button class="btn ghost" id="skip" type="button">${it.t==="spot"?"Voir la correction":"I don't know"}</button>${R.single?"":`<button class="btn ghost" id="pass" type="button">Next →</button>`}</div>
 <div class="fb" id="fb"></div><div id="bonusbox"></div></div></div>`;
 wire(it);
}

function wire(it){
