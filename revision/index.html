 const check=document.getElementById("check");
 document.getElementById("skip").onclick=()=>grade(it,null,true);
 const ps=document.getElementById("pass");if(ps)ps.onclick=()=>{R.passed=(R.passed||0)+1;R.i++;if(R.i<10&&R.i<R.items.length)show();else end()};
 R.hinted=false;
 const hb=document.getElementById("hint");
 const cb=document.getElementById("conf");
 const addPill=(cls,lab,txt)=>{document.getElementById("fb").insertAdjacentHTML("beforeend",`<div class="pill ${cls}"><b>${lab}</b><span>${esc(txt)}</span></div>`)};
 hb.onclick=()=>{R.hinted=true;hb.disabled=true;addPill("remember","Hint",it.hq)};
 cb.onclick=()=>{R.hinted=true;cb.disabled=true;addPill("trap","≠ À ne pas confondre",it.nc)};
 if(it.t==="mc")stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{stage.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));b.classList.add("on");st.mc=+b.dataset.k});
 if(it.t==="spot"){st.sp=[];stage.querySelectorAll(".wd").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,i=st.sp.indexOf(k);if(i>=0){st.sp.splice(i,1);b.classList.remove("on")}else{if(st.sp.length>=it.a.length){const o=st.sp.shift();stage.querySelector(`.wd[data-k="${o}"]`).classList.remove("on")}st.sp.push(k);b.classList.add("on")}})}
 if(it.t==="type"){const inp=document.getElementById("ans");inp.focus();inp.onkeydown=e=>{if(e.key==="Enter")check.click()}}
 if(it.t==="drag"){
  const gs=[...stage.querySelectorAll(".gap")];let sel=0;
  const mark=()=>gs.forEach((g,k)=>g.classList.toggle("sel",k===sel));mark();
  const put=(tile,k)=>{if(st.fill[k])free(k);st.fill[k]=tile;gs[k].textContent=tile.dataset.w;tile.classList.add("used");const nx=gs.findIndex((g,j)=>!st.fill[j]);sel=nx<0?k:nx;mark()};
  const free=k=>{st.fill[k].classList.remove("used");st.fill[k]=null;gs[k].innerHTML="&nbsp;"};
  stage.querySelectorAll("#bank .tile").forEach(t=>{t.onclick=()=>put(t,sel);t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.t)}});
  gs.forEach((g,k)=>{g.onclick=()=>{if(st.fill[k])free(k);sel=k;mark()};g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();g.click()}};
   g.ondragover=e=>{e.preventDefault();g.classList.add("over")};g.ondragleave=()=>g.classList.remove("over");
   g.ondrop=e=>{e.preventDefault();g.classList.remove("over");const t=stage.querySelector(`#bank .tile[data-t="${e.dataTransfer.getData("text/plain")}"]`);if(t&&!t.classList.contains("used"))put(t,k)}});
 }
 if(it.t==="order"){
  const line=document.getElementById("line");
  const add=t=>{const c=t.cloneNode(true);c.classList.remove("used");c.removeAttribute("draggable");line.appendChild(c);t.classList.add("used");st.line.push(t.dataset.w);
   c.onclick=()=>{const k=[...line.children].indexOf(c);st.line.splice(k,1);c.remove();t.classList.remove("used")}};
  stage.querySelectorAll("#bank .tile").forEach(t=>{t.onclick=()=>add(t);t.ondragstart=e=>e.dataTransfer.setData("text/plain",t.dataset.t)});
  line.ondragover=e=>e.preventDefault();
  line.ondrop=e=>{e.preventDefault();const t=stage.querySelector(`#bank .tile[data-t="${e.dataTransfer.getData("text/plain")}"]`);if(t&&!t.classList.contains("used"))add(t)};
 }
 check.onclick=()=>{
  let given;
  if(it.t==="mc"){if(st.mc===null)return;given=st.mc}
  if(it.t==="type"){given=document.getElementById("ans").value;if(!given.trim())return}
  if(it.t==="drag"){const n=stage.querySelectorAll(".gap").length;if(st.fill.filter(Boolean).length<n)return;given=st.fill.map(t=>t.dataset.w)}
  if(it.t==="order"){if(!st.line.length)return;given=st.line.join(" ")}
  if(it.t==="spot"){if(st.sp.length<it.a.length)return;given=st.sp.slice()}
  grade(it,given,false);
 };
}

function adapt(it,ok){
 if(R.single)return;
 R.okf=R.okf||{};
 const used=new Set(R.items.map(x=>x.id)),rest=R.items.slice(R.i+1);
 const fresh=f=>I.filter(x=>x.y<=S.year&&x.f===f&&!used.has(x.id)).sort((a,b)=>{const r=x=>{const s=S.item[x.id];return !s?0:s.last?2:1};return r(a)-r(b)||Math.random()-.5});
 const strongest=()=>{let best=-1,k=-1;rest.forEach((x,j)=>{if(x.f===it.f)return;const p=mastery(x.f).pct;if(p>best){best=p;k=j}});return k};
 if(!ok){
  if(!rest.length)return;
  const c=fresh(it.f)[0];if(!c)return;
  const nc=Object.assign({},c,{relance:1});
  let k=strongest();if(k<0&&rest.length)k=rest.length-1;
  if(k>=0)rest.splice(k,1);
  rest.unshift(nc);
 }else{
  R.okf[it.f]=(R.okf[it.f]||0)+1;
  if(R.okf[it.f]<2)return;
  const fams=Object.keys(FAM).filter(f=>f!==it.f).sort((a,b)=>mastery(a).pct-mastery(b).pct);
  for(let j=0;j<rest.length;j++){
   if(rest[j].f!==it.f)continue;
   for(const f of fams){const c=fresh(f).find(x=>!rest.some(r=>r.id===x.id));if(c){rest[j]=c;break}}
  }
 }
 R.items=R.items.slice(0,R.i+1).concat(rest);
}

function grade(it,given,skipped){
 let ok=false,shown="";
 if(!skipped){
  if(it.t==="mc"){ok=given===it.a;shown=it.o[given];stage.querySelectorAll(".opt").forEach(b=>{const k=+b.dataset.k;if(k===it.a)b.classList.add("good");else if(k===given)b.classList.add("bad")})}
  if(it.t==="type"){ok=it.a.some(a=>norm(a)===norm(given));shown=given}
  if(it.t==="drag"){ok=given.every((g,k)=>g===it.a[k]);shown=given.join(" / ")}
  if(it.t==="order"){ok=norm(given)===norm(it.a);shown=given}
  if(it.t==="spot"){const ws=it.q.split(" ");ok=it.a.every(g=>g.some(k=>given.includes(k)))&&given.length===it.a.length;shown=given.map(k=>ws[k]).join(" … ")}
 }
 if(it.t==="spot")stage.querySelectorAll(".wd").forEach(b=>{const k=+b.dataset.k;if(it.a.some(g=>g.includes(k)))b.classList.add("good");else if(given&&given.includes(k))b.classList.add("bad")});
 const fs=S.fam[it.f]||(S.fam[it.f]={seen:0,ok:0});fs.seen++;if(ok)fs.ok+=R.hinted?0.5:1;
 S.item[it.id]={last:ok&&!R.hinted,when:S.round};
 if(ok)R.score++;else R.miss.push(it.f);
 save();meters();
 const fb=document.getElementById("fb");
 fb.innerHTML=(ok?`<div class="pill model"><b>✓ RIGHT</b><span>${esc(it.m)}</span></div>`:
  `${skipped?"":`<div class="pill wrong"><b>✗ WRONG</b><span>${esc(shown)}</span></div>`}<div class="pill model"><b>✓ MODEL</b><span>${esc(it.m)}</span></div>`)+
  `<div class="pill note"><b>Explication</b><span>${esc(it.w)}</span></div><div class="pill remember"><b>Rappel de cours</b><span>${esc(it.h2)}</span></div>`+(it.gs?`<button class="btn ghost" id="gsbtn" type="button">Sheet: ${esc(GS.find(g=>g.id===it.gs).title)}</button>`:"");
 if(it.gs)document.getElementById("gsbtn").onclick=()=>openGS(it.gs);
 stage.querySelectorAll(".tile,.opt,.gap,.wd,#ans,#hint,#conf").forEach(e=>{e.disabled=true;e.style.pointerEvents="none"});
 bonus(document.getElementById("bonusbox"),it.m,it.fr);
 const act=stage.querySelector(".act");
 act.innerHTML=`<button class="btn" id="next" type="button">${R.single?"← Back":R.i<9&&R.i<R.items.length-1?"Next":"See my round"}</button>`;
 const nx=document.getElementById("next");nx.focus();
 nx.onclick=()=>{adapt(it,ok&&!R.hinted);R.i++;if(R.single){back();return}if(R.i<10&&R.i<R.items.length)show();else end()};
}

function end(again){
 if(!again){S.round++;save()}
 const fams=[...new Set(R.miss)];
 stage.innerHTML=`<div class="prog" aria-hidden="true"><i style="width:100%"></i></div><div class="card"><div class="cardhead"><b>Round finished</b><span>Round ${S.round}</span></div><div class="cardbody">

/* ---------- BONUS: translate into French ---------- */
function bonus(box,en,ref){
 if(!box||!ref)return;
 box.innerHTML=`<div class="bonus"><p class="small"><b>Bonus</b> · Translate into French.</p><p class="en">${esc(en)}</p>
 <label class="small" for="trx">Ma traduction</label><textarea id="trx" spellcheck="false"></textarea>
 <div class="act"><button class="btn ghost" id="trcheck" type="button">Corriger</button></div><div class="fb" id="trfb"></div></div>`;
 const b=document.getElementById("trcheck"),out=document.getElementById("trfb");
 b.onclick=async()=>{
  const mine=document.getElementById("trx").value.trim();if(!mine)return;
  b.disabled=true;S.bonus.done++;save();meters();
  const refPill=`<div class="pill model"><b>✓ MODEL</b><span>${esc(ref)}</span></div>`;
  if(!SAMPLE){out.innerHTML=refPill;return}
  out.innerHTML=`<div class="pill note"><b>…</b><span></span></div>`;
  const prompt=`Tu corriges la traduction en français d'une phrase anglaise, faite par un étudiant francophone de licence LEA à l'Université de la Nouvelle-Calédonie.
Phrase anglaise : "${en}"
Une traduction juste parmi d'autres : "${ref}"
Traduction de l'étudiant : "${mine}"
Évalue deux choses séparément.
1) LA COMPRÉHENSION de l'anglais : contresens, faux-sens, omission, ajout. Une traduction différente de la référence mais fidèle au sens est juste.
2) L'ÉCRITURE du français : orthographe, accords, conjugaison, syntaxe, ponctuation, calques de l'anglais.
Ne relève que de vraies erreurs, les plus graves d'abord : 2 erreurs de sens au plus, 3 erreurs d'écriture au plus.
Pour chaque erreur, donne seulement les mots fautifs de l'étudiant (1 à 4 mots) et leur correction (1 à 4 mots). Aucune explication, aucune phrase.
Réponds uniquement par un objet JSON de cette forme :
{"comprehension":"juste|partielle|fausse","erreurs_sens":[{"extrait":"...","correction":"..."}],"erreurs_ecriture":[{"extrait":"...","correction":"...","type":"orthographe|accord|conjugaison|syntaxe|ponctuation|calque"}]}`;
  try{
   let r;
   if(typeof SAMPLE.json==="function")r=await SAMPLE.json(prompt,{modelTier:"quick"});
   else{const t=(await SAMPLE(prompt,{modelTier:"quick"})).text;r=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}
   const c=String(r.comprehension||"");
   const cls=c==="juste"?"model":c==="partielle"?"trap":"wrong",lab=c==="juste"?"✓ SENS":c==="partielle"?"⚠ SENS":"✗ SENS";
   const fix=e=>`<s>${esc(e.extrait)}</s> → <b>${esc(e.correction||e.explication||"")}</b>`;
   const sens=(r.erreurs_sens||[]).slice(0,2).map(fix).join(" · ");
   const ecr=(r.erreurs_ecriture||[]).slice(0,3);
   out.innerHTML=`<div class="pill ${cls}"><b>${lab}</b><span>${sens}</span></div>`+
    (ecr.length?`<div class="pill wrong"><b>✗ FRANÇAIS</b><span>${ecr.map(fix).join(" · ")}</span></div>`:`<div class="pill model"><b>✓ FRANÇAIS</b><span></span></div>`)+refPill;
  }catch(e){
   out.innerHTML=refPill;
  }
 };
}

/* ---------- LISTENING ---------- */
let LR=null;
function stopAudio(){try{TTS&&TTS.stop()}catch(e){}try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}}
async function speak(text,slow){
 const t=text.replace(/[\[\]]/g,"");
 stopAudio();
 if(TTS){try{await TTS.speak(t,{rate:slow?0.8:1,language:"en"});return true}catch(e){if(e&&e.code==="not_granted")TTS=null;else return true}}
 if(window.speechSynthesis&&window.SpeechSynthesisUtterance){
  const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=slow?0.8:0.95;
  const v=speechSynthesis.getVoices().find(v=>/^en-GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);return true}
 return false;
}
function listenStart(){
 const pool=LP.filter(p=>p.y<=S.year);const list=pool.length?pool:LP;
 const p=list.slice().sort((a,b)=>((S.listen[a.id]||{n:0}).n-(S.listen[b.id]||{n:0}).n)||Math.random()-0.5)[0];
 openListening(p);
}
function openListening(p){LR=null;go(()=>listenView(p))}
function boldify(text,vocab){
 let t=esc(text);const marks=[];
 vocab.slice().sort((a,b)=>b[0].length-a[0].length).forEach(([en,fr])=>{
  const re=new RegExp("(^|[^A-Za-z])("+esc(en).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?=[^A-Za-z]|$)","g");
  t=t.replace(re,(m,a,b)=>{marks.push(`<b class="hl" tabindex="0" role="button" data-fr="${esc(fr)}">${b}</b>`);return a+"\u0001"+(marks.length-1)+"\u0002"});
 });
 return t.replace(/\u0001(\d+)\u0002/g,(m,k)=>marks[+k]);
}
function wireGloss(root){root.querySelectorAll("b.hl").forEach(b=>{const tog=()=>{const n=b.nextElementSibling;if(n&&n.classList.contains("gloss"))n.remove();else b.insertAdjacentHTML("afterend",`<span class="gloss"> (${esc(b.dataset.fr)})</span>`)};b.onclick=tog;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}}})}

 if(!LR||LR.p!==p)LR={p,plays:0,slow:false,done:false,order:p.qs.map(q=>shuf(q.o.map((o,k)=>[o,k]))),pick:p.qs.map(()=>null),helped:p.qs.map(()=>false)};

 <p class="hint" id="noaudio" hidden>No audio in this browser.</p>
 ${p.qs.map((q,i)=>`<div class="qblock"><p class="q">${i+1}. ${esc(q.q)}</p><div class="opts">${LR.order[i].map(([o,k])=>`<button type="button" class="opt${LR.pick[i]===k?" on":""}" data-q="${i}" data-k="${k}">${esc(o)}</button>`).join("")}</div>
 <button class="linkbtn" type="button" data-ex="${i}">Script for this question</button><div id="lx${i}"></div><div class="fb" id="lf${i}"></div></div>`).join("")}
 <div class="act" id="lact"><button class="btn" id="lcheck" type="button">Check my answers</button><button class="btn ghost" id="lfull" type="button">Full script</button><button class="btn ghost" id="lskip" type="button">Next →</button></div><div id="fullbox"></div>
 <div id="trbox"></div><div id="bonusbox"></div></div></div>`;
 const sl=document.getElementById("slow");
 document.getElementById("play").onclick=async()=>{LR.plays++;document.getElementById("plays").textContent=`Played ${LR.plays} time${LR.plays>1?"s":""}`;const ok=await speak(p.text,LR.slow);if(!ok)document.getElementById("noaudio").hidden=false};
 sl.onclick=()=>{LR.slow=!LR.slow;sl.setAttribute("aria-pressed",String(LR.slow))};
 document.getElementById("stop").onclick=stopAudio;
 stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(LR.done)return;const i=+b.dataset.q;stage.querySelectorAll(`.opt[data-q="${i}"]`).forEach(x=>x.classList.remove("on"));b.classList.add("on");LR.pick[i]=+b.dataset.k});
 const showEx=i=>{document.getElementById("lx"+i).innerHTML=`<div class="transcript"><p class="small"><b>Script · question ${i+1}</b></p>… ${esc(p.ex[i])} …<br><button class="linkbtn" type="button" data-say="${i}">▶ Hear this passage</button></div>`;
  stage.querySelector(`[data-say="${i}"]`).onclick=()=>speak(p.ex[i],LR.slow)};
 stage.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ex;if(!LR.done)LR.helped[i]=true;showEx(i)});
 LR.helped.forEach((x,i)=>{if(x)showEx(i)});
 const lfull=document.getElementById("lfull");

  LR.done=true;stopAudio();

  const prev=S.listen[p.id]||{n:0,best:0};S.listen[p.id]={n:prev.n+1,best:Math.max(prev.best,sc),last:sc};save();meters();
  listenReveal(p);
 };
 if(LR.done)listenReveal(p);
}

}

 <p class="q">Grammar</p><div class="cards">${GS.map(g=>`<button type="button" data-g="${g.id}"><b>${esc(g.title)}</b></button>`).join("")}</div><p class="q" style="margin-top:18px">Listening</p><div class="cards">${LP.map(p=>`<button type="button" data-p="${p.id}"><b>${esc(p.title)}</b><br><span class="small">${esc(p.src)}${S.listen[p.id]?" · ✓ listened":""}</span></button>`).join("")}</div></div></div>`;
 stage.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>openGS(b.dataset.g));
 stage.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{const p=LP.find(x=>x.id===b.dataset.p);SV={side:"recto",hide:false};go(()=>sheetView(p))});
}
function sheetView(p){
 const recto=SV.side==="recto";
 stage.innerHTML=`<div class="card sheet"><div class="cardhead"><b>Revision sheet · ${recto?"Recto":"Verso"}</b><span>${esc(p.title)}</span></div><div class="cardbody">
 <div class="years" role="tablist"><button type="button" class="yr${recto?" on":""}" data-side="recto">Recto · Vocabulary</button><button type="button" class="yr${recto?"":" on"}" data-side="verso">Verso · Learn by heart</button><button type="button" class="btn ghost" id="hidefr" aria-pressed="${SV.hide}">${SV.hide?"Show the French":"Hide the French (test yourself)"}</button></div>
 <div class="${SV.hide?"hidefr":""}" id="sheetbody">
 ${recto?`<table><thead><tr><th>English</th><th>Français</th></tr></thead><tbody>${p.vocab.map(([en,fr])=>`<tr><td>${esc(en)}</td><td class="fr">${esc(fr)}</td></tr>`).join("")}</tbody></table>`:
 `<ul class="learn">${p.learn.map(([en,fr],k)=>`<li><p class="en">${esc(en)}</p><button class="btn ghost" type="button" data-say="${k}" aria-label="Hear the sentence">▶</button><p class="fr">${esc(fr)}</p></li>`).join("")}</ul>
 <div class="fb"><div class="pill remember"><b>Grammaire à retenir</b><span>${esc(p.gram)}</span></div></div>`}
 </div>
 <div class="act"><button class="btn" id="flip" type="button">Turn the sheet over</button><button class="btn ghost" id="relisten" type="button">Listen to the report</button><button class="btn ghost" id="allsheets" type="button">All sheets</button></div>
 </div></div>`;
 stage.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{SV.side=b.dataset.side;sheetView(p)});
 document.getElementById("flip").onclick=()=>{SV.side=recto?"verso":"recto";sheetView(p)};
 document.getElementById("hidefr").onclick=()=>{SV.hide=!SV.hide;sheetView(p)};
 stage.querySelectorAll("#sheetbody .fr").forEach(e=>e.onclick=()=>{e.style.filter="none"});
 stage.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(p.learn[+b.dataset.say][0],false));
 document.getElementById("relisten").onclick=()=>openListening(p);
 document.getElementById("allsheets").onclick=()=>go(sheetsList);
}

function gsheetView(g){
 const recto=SV.side==="recto";
 const pill=([c,b,t])=>`<div class="pill ${c}"><b>${esc(b)}</b><span>${esc(t)}</span></div>`;
 stage.innerHTML=`<div class="card sheet"><div class="cardhead"><b>Grammar sheet · ${recto?"Recto":"Verso"}</b><span>${esc(g.title)}</span></div><div class="cardbody">
 <div class="years" role="tablist"><button type="button" class="yr${recto?" on":""}" data-side="recto">${esc(g.rl||"Recto")}</button><button type="button" class="yr${recto?"":" on"}" data-side="verso">${esc(g.vl||"Verso")}</button>${recto?"":`<button type="button" class="btn ghost" id="hidefr" aria-pressed="${SV.hide}">${SV.hide?"Show the French":"Hide the French"}</button>`}</div>
 <div class="${SV.hide?"hidefr":""}" id="sheetbody">
 ${recto?`<div style="overflow-x:auto"><table><thead><tr>${g.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${g.rows.map(r=>`<tr>${r.map((c,k)=>k?`<td>${esc(c)}</td>`:`<th scope="row">${esc(c)}</th>`).join("")}</tr>`).join("")}</tbody></table></div>
 <div class="fb">${g.keys.map(pill).join("")}</div>`:
 `<div class="fb">${g.uses.map(pill).join("")}${g.errs.map(([x,y])=>`<div class="pill wrong"><b>✗ WRONG</b><span>${esc(x)}</span></div><div class="pill model"><b>✓ MODEL</b><span>${esc(y)}</span></div>`).join("")}</div>
 <p class="q" style="margin-top:18px">Learn by heart</p>
 <ul class="learn">${g.learn.map(([en,fr],k)=>`<li><p class="en">${esc(en)}</p><button class="btn ghost" type="button" data-say="${k}" aria-label="Hear the sentence">▶</button><p class="fr">${esc(fr)}</p></li>`).join("")}</ul>`}
 </div>
 <div class="act"><button class="btn" id="flip" type="button">Turn the sheet over</button><button class="btn ghost" id="allsheets" type="button">All sheets</button></div>
 </div></div>`;
 stage.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{SV.side=b.dataset.side;gsheetView(g)});
 document.getElementById("flip").onclick=()=>{SV.side=recto?"verso":"recto";gsheetView(g)};
 const hf=document.getElementById("hidefr");if(hf)hf.onclick=()=>{SV.hide=!SV.hide;gsheetView(g)};
 stage.querySelectorAll("#sheetbody .fr").forEach(e=>e.onclick=()=>{e.style.filter="none"});
 stage.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(g.learn[+b.dataset.say][0],false));
 document.getElementById("allsheets").onclick=()=>go(sheetsList);
}

/* ---------- SEARCH ---------- */
const fold=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘]/g,"'");
function hit(s,q){const f=fold(s),i=f.indexOf(q);if(i<0)return null;const a=Math.max(0,i-50),b=Math.min(s.length,i+q.length+60);return (a>0?"… ":"")+esc(s.slice(a,i))+"<mark>"+esc(s.slice(i,i+q.length))+"</mark>"+esc(s.slice(i+q.length,b))+(b<s.length?" …":"")}
const GLO=[["adjectif", "mot qui décrit un nom : grand, utile"], ["adjectif absolu", "qui ne peut pas être « plus ou moins » : unique, parfait"], ["adjectif composé", "mots reliés par des tirets devant un nom"], ["adjectifs", "mots qui décrivent un nom : grand, utile"], ["adverbe", "mot qui précise le verbe : souvent, très"], ["adverbes", "mots qui précisent le verbe : souvent, très"], ["apposition", "groupe entre virgules qui décrit un nom"], ["article", "a, an ou the"], ["articles", "a, an et the"], ["aspect", "action vue comme finie, en cours ou reliée au présent"], ["attribut", "ce qui suit be pour décrire le sujet"], ["auxiliaire", "verbe outil : « avoir » dans « j'ai mangé »"], ["base verbale", "le verbe tout nu, sans to ni s"], ["BE-ING", "be + verbe en -ing : action en cours"], ["bilan", "ce qui reste aujourd'hui d'une action passée"], ["calque", "traduction mot à mot du français"], ["calques", "traductions mot à mot du français"], ["collocation", "mots qui vont ensemble par habitude"], ["comparatif", "« plus grand que »"], ["complément", "ce qui complète le verbe ou le nom"], ["compléments", "ce qui complète le verbe ou le nom"], ["conditionnel", "forme en would : « je ferais »"], ["connecteur", "mot de liaison : cependant, donc"], ["connecteurs", "mots de liaison : cependant, donc"], ["dénombrable", "qu'on peut compter : un, deux, trois"], ["dénombrables", "qu'on peut compter : un, deux, trois"], ["faux ami", "ressemble au français, sens différent"], ["faux amis", "ressemblent au français, sens différent"], ["groupe nominal", "un nom et ses petits mots : « la pluie »"], ["génitif", "le 's de la possession"], ["gérondif", "verbe en -ing employé comme un nom"], ["HAVE-EN", "have + participe passé : have worked"], ["indénombrable", "qu'on ne compte pas : ni s, ni a/an"], ["indénombrables", "qu'on ne compte pas : ni s, ni a/an"], ["infinitif", "le verbe précédé de to"], ["invariable", "ne change jamais, pas de s"], ["invariables", "ne changent jamais, pas de s"], ["inversion", "le verbe passe devant le sujet"], ["marqueur", "mot qui situe dans le temps : hier, depuis"], ["marqueurs", "mots qui situent dans le temps : hier, depuis"], ["nom composé", "deux noms collés : le premier décrit le second"], ["participe", "forme en -ed ou en -ing du verbe"], ["participe passé", "forme après « j'ai » : mangé, écrit"], ["participe présent", "forme en -ing : mangeant"], ["passif", "le sujet subit l'action : « est fabriqué »"], ["past perfect", "had + participe passé : un passé avant un autre passé"], ["present perfect", "have/has + participe passé : relie passé et présent"], ["principale", "partie de phrase qui tient seule"], ["pronominal", "verbe avec « se » : s'étendre"], ["proposition", "morceau de phrase avec son propre verbe"], ["préposition", "petit mot devant un nom : à, de, pour"], ["prépositions", "petits mots devant un nom : à, de, pour"], ["prétérit", "passé anglais d'un fait terminé"], ["quantifieur", "mot de quantité : beaucoup, quelques, aucun"], ["quantifieurs", "mots de quantité : beaucoup, quelques, aucun"], ["relative", "partie de phrase qui décrit un nom : « que j'ai lu »"], ["subjonctif", "forme après « il faut que »"], ["subordonnée", "partie de phrase qui dépend d'une autre : if…, when…"], ["superlatif", "« le plus grand »"], ["V-ing", "verbe + -ing : working"], ["vrai verbe d'action", "verbe au sens précis, pas be, have, make, do"], ["verbes pleins", "verbes au sens précis, pas be, have, make, do"], ["voix passive", "le sujet subit l'action : « est fabriqué »"]];
function searchView(raw){
 const q=fold(raw.trim());const out=[];
 if(q.length>=2){
  LP.forEach(p=>{
   p.vocab.forEach(([en,fr])=>{const h1=hit(en,q)||hit(fr,q);if(h1)out.push({k:"Vocabulary",t:`${h1} <span class="small">· ${esc(en)} = ${esc(fr)} · ${esc(p.title)}</span>`,f:()=>{SV={side:"recto",hide:false};go(()=>sheetView(p))}})});
   p.learn.forEach(([en,fr])=>{const h1=hit(en,q)||hit(fr,q);if(h1)out.push({k:"Sentence to learn",t:`${h1} <span class="small">· ${esc(p.title)}</span>`,f:()=>{SV={side:"verso",hide:false};go(()=>sheetView(p))}})});
   const h2=hit(p.text,q)||hit(p.title,q);if(h2)out.push({k:"Listening",t:`<b>${esc(p.title)}</b><br>${h2}`,f:()=>openListening(p)});
  });
  GS.forEach(g=>{const txt=[g.title,...g.rows.flat(),...g.keys.map(k=>k[2]),...g.uses.map(k=>k[1]+" "+k[2]),...g.learn.flat()].join(" · ");const hh=hit(g.title,q)||hit(txt,q);if(hh)out.push({k:"Grammar sheet",t:`<b>${esc(g.title)}</b><br>${hh}`,f:()=>openGS(g.id)})});
 GLO.forEach(([t,g])=>{if(fold(t).includes(q)||(q.length>=4&&fold(t).startsWith(q.slice(0,-1))))out.push({k:"Grammar word",t:`<b>${esc(t)}</b> = ${esc(g)}`,f:null})});
 I.forEach(it=>{const h3=hit(it.m,q)||hit(it.q||"",q)||hit(it.fr||"",q)||hit(it.w,q)||hit(it.h2,q)||hit(FAM[it.f].n,q);if(h3)out.push({k:"Exercise",t:`${h3} <span class="small">· ${esc(FAM[it.f].n)}</span>`,f:()=>practice(it)})});
 }
 const order=["Grammar word","Grammar sheet","Vocabulary","Sentence to learn","Listening","Exercise"];
 out.sort((a,b)=>order.indexOf(a.k)-order.indexOf(b.k));
 const shown=out.slice(0,40);
 stage.innerHTML=`<div class="card"><div class="cardhead"><b>Search</b><span>« ${esc(raw)} » · ${out.length} result${out.length>1?"s":""}</span></div><div class="cardbody">
 ${q.length<2?`<p class="small">Type at least two letters.</p>`:out.length?`<div class="res">${shown.map((r,k)=>r.f?`<button type="button" data-r="${k}"><span class="tag">${r.k}</span> ${r.t}</button>`:`<div class="glo"><span class="tag">${r.k}</span> ${r.t}</div>`).join("")}</div>${out.length>40?`<p class="small">40 first results.</p>`:""}`:`<p class="small">No result.</p>`}
 </div></div>`;
 stage.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>shown[+b.dataset.r].f());
}
document.getElementById("sform").onsubmit=e=>{e.preventDefault();const v=document.getElementById("sq").value;go(()=>searchView(v))};
document.getElementById("back").onclick=back;
document.getElementById("homebtn").onclick=()=>{try{stopAudio()}catch(e){}home();try{window.scrollTo(0,0)}catch(e){}};
document.getElementById("sheetsbtn").onclick=()=>go(sheetsList);

function meters(){
 const rows=Object.keys(FAM).map(f=>[f,mastery(f)]).sort((a,b)=>a[1].pct-b[1].pct);
 const ld=Object.keys(S.listen).length;
 document.getElementById("meters").innerHTML=`<div class="meter"><span>Listening</span><span>${ld}/${LP.length}</span><div class="bar"><i style="width:${Math.max(4,100*ld/LP.length)}%;background:var(--blue)"></i></div></div><div class="meter"><span>Bonus translations</span><span>${S.bonus.done}</span><div class="bar"><i style="width:${Math.min(100,Math.max(4,S.bonus.done*2))}%;background:var(--blue)"></i></div></div>`+rows.map(([f,m])=>{
  const col=m.seen===0?"var(--line)":m.pct<50?"var(--red)":m.pct<75?"var(--amber)":"var(--green)";
  return `<div class="meter" title="${esc(FAM[f].tip)}"><span>${esc(FAM[f].n)}</span><span>${m.seen?m.pct+"%":"new"}</span><div class="bar"><i style="width:${m.seen?m.pct:4}%;background:${col}"></i></div></div>`}).join("");
}

document.getElementById("reset").onclick=e=>{
 const b=e.currentTarget;
 if(b.dataset.sure){S={year:S.year,fam:{},item:{},round:0,listen:{},bonus:{done:0}};save();meters();home();b.textContent="Start again from zero";delete b.dataset.sure}
 else{b.dataset.sure="1";b.textContent="Tap again to erase my progress"}
};
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!(document.activeElement&&/TEXTAREA|INPUT/.test(document.activeElement.tagName)&&document.activeElement.id!=="ans")){const n=document.getElementById("next");if(n&&document.activeElement!==n){e.preventDefault();n.click()}}});

meters();home();
}
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
